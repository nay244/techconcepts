<style>
  /* The prototype's own frame. None of it is built. */
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #2a2d30; color: #f1f3f4; font: 14px/1.3 system-ui, sans-serif; }

  .stage[data-stack='1'] { flex-direction: column; }
  .cell { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; margin: 0; }
  .cell figcaption { flex: none; padding: 0 0 6px; color: #c9cfd3; }
  .port { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .port iframe { position: absolute; left: 0; top: 0; border: 0; background: #fff; transform-origin: 0 0; }

/* HEADER AND FOOTER BEGIN: the site's header and footer in the Card stack look (prototypes/d23-header-footer.md).
   The components' own Patch styles (SiteHeader.astro, SiteFooter.astro, ThemeToggle.css, site.css) are the base; this
   block restyles them on the pages that import this file. The Lesson page does not, so its header keeps Patch.
   Every selector starts at header.site-head, .site-head, footer.site-foot or .site-foot and carries one more class or
   element than the rule it restyles, so it wins in any order, with no !important. The header stays 69px: a 67px row
   and a 2px edge. Open below 960px it stays 391px (329px without Start learning): a 322px (260px) panel. */
/* The header is solid now, so the skip link, which sat under it (z-index 10 under 20), is lifted over it. */
a.skip-link {
  z-index: 21;
}
header.site-head {
  border-bottom: 2px solid var(--cs-edge);
  background: var(--ground);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
/* 1px of padding on top puts the 44px controls on whole pixels (12px above, 11px and the edge below). Below 342px the
   side padding gives way evenly, so the brand and the two 44px buttons fit: 278px is 164 + 16 + 44 + 10 + 44. */
header.site-head .wrap {
  height: 67px;
  padding: 1px clamp(16px, (100vw - 278px) / 2, 32px) 0;
}
/* The five links: one strip of card. The section you are in has the orange marker and the pale orange wash. */
.site-head .pillnav {
  gap: 2px;
  padding: 2px;
  border: 2px solid var(--cs-edge);
  border-radius: var(--cs-r-in);
  background: var(--cs-card);
  box-shadow: none;
}
.site-head .pillnav a {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 12px;
  border-radius: 4px;
  color: var(--ink);
  white-space: nowrap;
}
.site-head .pillnav a:not([aria-current]):hover {
  background: var(--cs-quiet);
  color: var(--ink-strong);
}
.site-head .pillnav a[aria-current] {
  background: var(--cs-here-wash);
  box-shadow: none;
  color: var(--ink-strong);
}
.site-head .pillnav a[aria-current]::before,
.site-head .menu-panel a[aria-current]::before {
  content: '';
  flex: none;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  background: var(--cs-here);
  box-shadow: 0 0 0 1.5px var(--cs-edge);
}
/* The theme and menu buttons: 44px, a hard edge, no offset edge (they change the page you are on, they do not take you on). */
.site-head .icon-btn {
  flex: none;
  width: 44px;
  height: 44px;
  border: 2px solid var(--cs-edge);
  border-radius: var(--cs-r-in);
  background: var(--cs-card);
}
.site-head .icon-btn:hover {
  background: var(--cs-quiet);
}
.site-head .icon-btn svg {
  width: 20px;
  height: 20px;
}
/* The menu is open: the button is filled in. */
.site-head .menu-btn[aria-expanded='true'] {
  background: var(--cs-edge);
  color: var(--cs-card);
}
/* Start learning: the Card stack button, 44px in the row and 48px in the menu. Its offset edge ends on the column's line. */
.site-head .btn {
  margin-right: var(--cs-off);
  border: 2px solid var(--cs-edge);
  border-radius: var(--cs-r-in);
  box-shadow: var(--cs-act-edge);
  white-space: nowrap;
  transition:
    transform 80ms var(--ease-out),
    box-shadow 80ms var(--ease-out);
}
.site-head .btn--primary {
  background: var(--cs-act);
  color: var(--cs-act-ink);
}
.site-head .btn--primary:hover {
  background: color-mix(in srgb, var(--cs-act) 88%, var(--cs-edge));
}
.site-head .btn--small {
  min-height: 44px;
  font-size: 17px;
}
.site-head .btn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--cs-edge);
}
@media (max-width: 959px) {
  /* 1 + 8 + five rows of 45 + their gaps + 18 = 260px; with Start learning (2 + 12 + 48) 322px. */
  .site-head .menu-panel {
    border-top: 1px solid var(--cs-hair);
    padding: 8px clamp(16px, (100vw - 278px) / 2, 32px) 18px;
  }
  .site-head .menu-panel a {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 45px;
    padding: 0;
    border-bottom: 1px solid var(--cs-hair);
    font: 600 18px/1.2 var(--display);
    letter-spacing: 0.01em;
  }
  .site-head .menu-panel a[aria-current] {
    font-weight: 700;
  }
  .site-head .menu-panel .btn {
    min-height: 48px;
    margin-top: 12px;
    border: 2px solid var(--cs-edge);
    color: var(--cs-act-ink);
  }
}

/* The footer: the last card, as wide as the page. */
footer.site-foot {
  border-top: 2px solid var(--cs-edge);
  background: var(--cs-card);
}
.site-foot .foot-grid p {
  color: var(--ink);
}
/* A link's own 4px of padding stands in for 4px of the heading's margin, so heading to words is 14px, as before. */
.site-foot .foot-grid h3 {
  margin-bottom: 10px;
}
.site-foot .foot-grid ul {
  gap: 2px;
}
.site-foot .foot-grid ul a {
  display: inline-block;
  padding: 4px 0;
  color: var(--ink);
}
.site-foot .foot-grid ul a:hover {
  color: var(--ink-strong);
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 4px;
}
.site-foot .foot-base {
  border-top: 1px solid var(--cs-hair);
}
/* On a phone each link is a 44.8px target, and the grid gives back 28px of its padding. */
@media (max-width: 720px) {
  .site-foot .foot-grid {
    padding: 40px 0 28px;
  }
  .site-foot .foot-grid ul {
    gap: 0;
  }
  .site-foot .foot-grid ul a {
    padding: 10px 0;
  }
}
/* HEADER AND FOOTER END */
</style><style id="d23-b" media="not all">
/* Variant B of the five links only: index tabs on the header's edge. Replaces the three .pillnav rules of the block. */
.site-head .pillnav {
  align-self: end;
  gap: 2px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  box-shadow: none;
}
.site-head .pillnav a {
  height: 38px;
  padding: 0 12px;
  border: 2px solid transparent;
  border-bottom: 0;
  border-radius: var(--cs-r-in) var(--cs-r-in) 0 0;
}
.site-head .pillnav a:not([aria-current]):hover {
  background: none;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
}
.site-head .pillnav a[aria-current] {
  border-color: var(--cs-edge);
  background: var(--cs-card);
}

main"><section class="wrap a-open" aria-labelledby="about-title"><div class="a-open__main"><nav class="a-crumbs" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li><span aria-current="page">About</span></li></ol></nav><h1 id="about-title">Watch it happen, then learn its name.</h1><p class="a-lede">TechConcepts is a free site of short, visual lessons on how technology works. You watch a real process play out one step at a time, then read what it was, in plain words.</p></div><div class="a-open__side"><dl class="stats cs-card"><div><dt>tracks planned</dt><dd>7</dd></div><div><dt>lessons ready</dt><dd>30</dd></div><div><dt>accounts needed</dt><dd>0</dd></div></dl><nav class="a-toc cs-card" aria-label="On this page"><p class="a-toc__h cs-tab">On this page</p><ol><li><a href="#what">What it is</a></li><li><a href="#lessons">How a lesson works</a></li><li><a href="#facts">Where the facts come from</a></li><li><a href="#credits">Credits</a></li><li><a href="#privacy">Your progress</a></li></ol></nav></div></section><div class="wrap a-body"><section class="a-sec cs-card" id="what" aria-labelledby="what-h"><h2 class="cs-tab" id="what-h">What TechConcepts is</h2><div class="a-cols"><p>TechConcepts teaches how technology works by showing it. Each lesson plays a real process, such as a laptop asking the network for an address, one step at a time, and explains each step in plain words.</p><p>The first track, How the Internet Works, is written for anyone starting out, including people studying for entry-level IT certifications. Five more tracks are on the way: CompTIA A+, Cryptography, AI Concepts, Privilege Escalation, and Threat &amp; Vulnerability Management.</p><p>You don’t need an account, and you can open any lesson in any order.</p></div></section><section class="a-sec cs-card" id="lessons" aria-labelledby="lessons-h"><h2 class="cs-tab" id="lessons-h">How a lesson works</h2><p>Every lesson has the same three parts, so you always know where you are.</p><ol class=" >3</b> Practice</span><h3>Check yourself</h3><p>A few questions, just for you. Each answer says why it’s right or not. Nothing is scored or saved.</p></div></li></ol><div class="a-after"><div class="a-note"><svg class="t" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 7v5l3.2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg><p><b>Lessons are self-paced.</b> Take as long as you need. This browser remembers where you stopped, so you can pick up where you left off.</p></div><p>The example networks use addresses set aside for documentation and private use, so nothing in a lesson points at a real machine.</p></div></section><section class="a-sec cs-card" id="facts" aria-labelledby="facts-h"><h2 class="cs-tab" id="facts-h">Where the facts come from</h2><div class="a-facts"><div><p>Each lesson lists the standards it draws on under Sources at the end of Learn. Every lesson has also been through an independent check of every claim against those sources.</p><div class="a-facts__art" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg lm-svg lm-sources" viewBox="36 30 528 386" role="img" aria-label="A report sheet on a board, one line of it lit and marked with a source number, a small loupe standing over the end of that line. Beside the sheet, three bound standards are stacked. In front, a stamp rests on its ink pad, and its tick is on the foot of the sheet."><path class="lm-pool" d="M526.4 383.3L514.3 389.1L501.5 394.6L488.2 399.7L474.4 404.4L460.1 408.8L445.4 412.8L430.2 416.4L414.8 419.6L399 422.4L382.9 424.8L366.6 426.7L350.1 428.3L333.5 429.4L316.8 430L300 430.2L283.2 430L266.5 429.4L249.9 428.3L233.4 426.7L217.1 424.8L201 422.4L185.2 419.6L169.8 416.4L154.6 412.8L139.9 408.8L125.6 404.4L111.8 399.7L98.5 394.6L85.7 389.1L73.6 383.3L62 377.3L51.1 370.9L40.9 364.2L31.4 357.3L22.7 350.2L14.7 /* HEADER AND FOOTER BEGIN: the site's header and footer in the Card stack look (prototypes/d23-header-footer.md).
   The components' own Patch styles (SiteHeader.astro, SiteFooter.astro, ThemeToggle.css, site.css) are the base; this
   block restyles them on the pages that import this file. The Lesson page does not, so its header keeps Patch.
   Every selector starts at header.site-head, .site-head, footer.site-foot or .site-foot and carries one more class or
   element than the rule it restyles, so it wins in any order, with no !important. The header stays 69px: a 67px row
   and a 2px edge. Open below 960px it stays 391px (329px without Start learning): a 322px (260px) panel. */
/* The header is solid now, so the skip link, which sat under it (z-index 10 under 20), is lifted over it. */
a.skip-link {
  z-index: 21;
}
header.site-head {
  border-bottom: 2px solid var(--cs-edge);
  background: var(--ground);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
/* 1px of padding on top puts the 44px controls on whole pixels (12px above, 11px and the edge below). Below 342px the
   side padding gives way evenly, so the brand and the two 44px buttons fit: 278px is 164 + 16 + 44 + 10 + 44. */
header.site-head .wrap {
  height: 67px;
  padding: 1px clamp(16px, (100vw - 278px) / 2, 32px) 0;
}
/* The five links: one strip of card. The section you are in has the orange marker and the pale orange wash. */
.site-head .pillnav {
  gap: 2px;
  padding: 2px;
  border: 2px solid var(--cs-edge);
  border-radius: var(--cs-r-in);
  background: var(--cs-card);
  box-shadow: none;
}
.site-head .pillnav a {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 12px;
  border-radius: 4px;
  color: var(--ink);
  white-space: nowrap;
}
.site-head .pillnav a:not([aria-current]):hover {
  background: var(--cs-quiet);
  color: var(--ink-strong);
}
.site-head .pillnav a[aria-current] {
  background: var(--cs-here-wash);
  box-shadow: none;
  color: var(--ink-strong);
}
.site-head .pillnav a[aria-current]::before,
.site-head .menu-panel a[aria-current]::before {
  content: '';
  flex: none;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  background: var(--cs-here);
  box-shadow: 0 0 0 1.5px var(--cs-edge);
}
/* The theme and menu buttons: 44px, a hard edge, no offset edge (they change the page you are on, they do not take you on). */
.site-head .icon-btn {
  flex: none;
  width: 44px;
  height: 44px;
  border: 2px solid var(--cs-edge);
  border-radius: var(--cs-r-in);
  background: var(--cs-card);
}
.site-head .icon-btn:hover {
  background: var(--cs-quiet);
}
.site-head .icon-btn svg {
  width: 20px;
  height: 20px;
}
/* The menu is open: the button is filled in. */
.site-head .menu-btn[aria-expanded='true'] {
  background: var(--cs-edge);
  color: var(--cs-card);
}
/* Start learning: the Card stack button, 44px in the row and 48px in the menu. Its offset edge ends on the column's line. */
.site-head .btn {
  margin-right: var(--cs-off);
  border: 2px solid var(--cs-edge);
  border-radius: var(--cs-r-in);
  box-shadow: var(--cs-act-edge);
  white-space: nowrap;
  transition:
    transform 80ms var(--ease-out),
    box-shadow 80ms var(--ease-out);
}
.site-head .btn--primary {
  background: var(--cs-act);
  color: var(--cs-act-ink);
}
.site-head .btn--primary:hover {
  background: color-mix(in srgb, var(--cs-act) 88%, var(--cs-edge));
}
.site-head .btn--small {
  min-height: 44px;
  font-size: 17px;
}
.site-head .btn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--cs-edge);
}
@media (max-width: 959px) {
  /* 1 + 8 + five rows of 45 + their gaps + 18 = 260px; with Start learning (2 + 12 + 48) 322px. */
  .site-head .menu-panel {
    border-top: 1px solid var(--cs-hair);
    padding: 8px clamp(16px, (100vw - 278px) / 2, 32px) 18px;
  }
  .site-head .menu-panel a {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 45px;
    padding: 0;
    border-bottom: 1px solid var(--cs-hair);
    font: 600 18px/1.2 var(--display);
    letter-spacing: 0.01em;
  }
  .site-head .menu-panel a[aria-current] {
    font-weight: 700;
  }
  .site-head .menu-panel .btn {
    min-height: 48px;
    margin-top: 12px;
    border: 2px solid var(--cs-edge);
    color: var(--cs-act-ink);
  }
}

/* The footer: the last card, as wide as the page. */
footer.site-foot {
  border-top: 2px solid var(--cs-edge);
  background: var(--cs-card);
}
.site-foot .foot-grid p {
  color: var(--ink);
}
/* A link's own 4px of padding stands in for 4px of the heading's margin, so heading to words is 14px, as before. */
.site-foot .foot-grid h3 {
  margin-bottom: 10px;
}
.site-foot .foot-grid ul {
  gap: 2px;
}
.site-foot .foot-grid ul a {
  display: inline-block;
  padding: 4px 0;
  color: var(--ink);
}
.site-foot .foot-grid ul a:hover {
  color: var(--ink-strong);
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 4px;
}
.site-foot .foot-base {
  border-top: 1px solid var(--cs-hair);
}
/* On a phone each link is a 44.8px target, and the grid gives back 28px of its padding. */
@media (max-width: 720px) {
  .site-foot .foot-grid {
    padding: 40px 0 28px;
  }
  .site-foot .foot-grid ul {
    gap: 0;
  }
  .site-foot .foot-grid ul a {
    padding: 10px 0;
  }
}
/* HEADER AND FOOTER END */
</style><style id="d23-b" media="not all">

  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  box-shadow: none;
}
.site-head .pillnav a {
  height: 38px;

  border-bottom: 0;
  border-radius: var(--cs-r-in) var(--cs-r-in) 0 0;
}
.site-head .pillnav a:not([aria-current]):hover {
  background: none;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
}
.site-head .pillnav a[aria-current] {
  border-color: var(--cs-edge);
  background: var(--cs-card);
}

le="region" aria-label="DHCP lease table" tabindex="0"><table class="tpanel__table"><caption><span class="tpanel__title">DHCP lease table</span><span class="tpanel__by"> <\!-- -->kept by the router</span></caption><thead><tr><th scope="col">IP address</th><th scope="col">MAC address</th><th scope="col">Device</th><th scope="col">Expires</th></tr></thead><tbody><tr><td class="tpanel__empty" colSpan="4">Empty. No leases yet.</td></tr></tbody></table></div></section><div class="timeline timeline--row" data-home="row"><nav class="timeline__nav" aria-label="This lesson"><ol class="tl"><li data-state="current"><button type="button" class="tl__stop" aria-label="Overview" aria-current="step" title="Overview" data-target="0"><span class="tl__mark" data-dot="" aria-hidden="true"></span><span class="tl__name" aria-hidden="true">Overview</span></button></li><li><button type="button" class="tl__stop" aria-label="Step 1, DHCP Discover" title="DHCP Discover" data-target="1"><span class="tl__mark" aria-hidden="true">1</span><span class="tl__name" aria-hidden="true">DHCP Discover</span></button></li><li><button type="button" class="tl__stop" aria-label="Step 2, DHCP Offer" title="DHCP Offer" data-target="2"><span class="tl__mark" aria-hidden="true">2</span><span class="tl__name" aria-hidden="true">DHCP Offer</span></button></li><li><button type="button" class="tl__stop" aria-label="Step 3, DHCP Request" title="DHCP Request" data-target="3"><span class="tl__mark" aria-hidden="true">3</span><span class="tl__name" aria-hidden="true">DHCP Request</span></button></li><li><button type="button" class="tl__stop" aria-label="Step 4, DHCP Acknowledge" title="DHCP Acknowledge" data-target="4"><span class="tl__mark" aria-hidden="true">4</span><span class="tl__name" aria-hidden="true">DHCP Acknowledge</span></button></li><li><button type="button" class="tl__stop" aria-label="Step 5, Lease Renewal" title="Lease Renewal" data-target="5"><span class="tl__mark" aria-hidden="true">5</span><span class dd>IP address, subnet mask, default gateway, DNS server</dd><dt>Exchange</dt><dd>Discover, Offer, Request, Acknowledge</dd><dt>Lease</dt><dd>Renewed at half its length</dd><dt>Defined in</dt><dd>RFC 2131, RFC 2132</dd></dl></section><noscript><div class="timeline__stack"><h2 class="console__ptitle">In this lesson</h2><ol><li>Overview</li><li>DHCP Discover</li><li>DHCP Offer</li><li>DHCP Request</li><li>DHCP Acknowledge</li><li>Lease Renewal</li><li>Learn</li><li>Practice</li></ol></div></noscript><div class="guide__table"></div><div class="guide__foot"><div class="console__controls"><button type="button" class="cbtn cbtn--speed" aria-label="Speed 1×. Click for 1.5×" title="Speed 1×. Click for 1.5×">1×</button><button type="button" class="cbtn cbtn--back" aria-label="Previous step" title="Previous step (←)" aria-disabled="true"><svg viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="M9 2L4 7l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><button type="button" class="cbtn cbtn--alt" aria-label="Play all" title="Play all (Space)" aria-disabled="false"><svg viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="M3 2l9 5-9 5z" fill="currentColor"></path></svg><span class="cbtn__label" aria-hidden="true">Play all</span></button><button type="button" class="cbtn cbtn--replay" aria-label="Replay step" title="Replay step" aria-disabled="true"><svg viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="M2.6 7.4A4.6 4.6 0 1 0 4 3.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><path d="M1.6 1.8l.9 3.2 3.1-.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><button type="button" class="cbtn cbtn--go" aria-label="Next: DHCP Discover, step 1" title="Next: DHCP Discover, step 1 (→)" aria-disabled="false"><span class="go__label">Next: DHCP Discover</span><svg
