<!--
  D7: what the rest of the site changes for the Practice page (plan.md, job 9). Spec: prototypes/d7-practice-site.md.
  One file, three screens, each the page as the site builds it today (its markup and styles were read from the built
  site, not redrawn) with this unit's changes applied:
    1. Header and footer  - Home's header, hero and footer, with a switch for the page it stands on
    2. Lesson: Practice   - the DHCP lesson at its Practice part
    3. About              - the whole About page
  Each screen is drawn in a frame the size of the window, so the site's own breakpoints apply.
  The yellow "Prototype" panel is not part of the design. Only the changed parts answer a press; the rest is still.
-->

;],[0,&quot;fact-first&quot;],[0,&quot;fact-ack&quot;],[0,&quot;fact-ignore&quot;],[0,&quot;fact-mac&quot;],[0,&quot;term-ip&quot;],[0,&quot;term-lease&quot;]]]}]}],&quot;overview&quot;:[0,{&quot;hook&quot;:[0,&quot;When you join a Wi-Fi network, your device needs an address so messages can find it, like a room number in a hotel. You don’t make one up. You ask the front desk, and they hand you a free one. DHCP is that front desk. It’s why you never type an address in yourself.&quot;],&quot;hookBacking&quot;:[0,{&quot;traces&quot;:[1,[[0,&quot;term-ip&quot;],[0,&quot;fact-home&quot;],[0,&quot;term-offer&quot;],[0,&quot;why-1&quot;]]]}],&quot;description&quot;:[0,&quot;DHCP hands each new device the few things it needs to start talking on a network. Your router usually does this job. It lends addresses out for a while, and keeps a list of who has which one.&quot;],&quot;backing&quot;:[0,{&quot;traces&quot;:[1,[[0,&quot;fact-settings&quot;],[0,&quot;fact-home&quot;],[0,&quot;term-lease&quot;],[0,&quot;term-lease-table&quot;]]]}],&quot;facts&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;Ports&quot;],&quot;value&quot;:[0,&quot;UDP 67 (server), UDP 68 (client)&quot;],&quot;backing&quot;:[0,{&quot;traces&quot;:[1,[[0,&quot;fact-ports&quot;]]]}]}],[0,{&quot;label&quot;:[0,&quot;Hands out&quot;],&quot;value&quot;:[0,&quot;IP address, subnet mask, default gateway, DNS server&quot;],&quot;backing&quot;:[0,{&quot;traces&quot;:[1,[[0,&quot;fact-settings&quot;]]]}]}],[0,{&quot;label&quot;:[0,&quot;Exchange&quot;],&quot;value&quot;:[0,&quot;Discover, Offer, Request, Acknowledge&quot;],&quot;backing&quot;:[0,{&quot;traces&quot;:[1,[[0,&quot;pattern&quot;]]]}]}],[0,{&quot;label&quot;:[0,&quot;Lease&quot;],&quot;value&quot;:[0,&quot;Renewed at half its length&quot;],&quot;backing&quot;:[0,{&quot;traces&quot;:[1,[[0,&quot;fact-t1&quot;],[0,&quot;term-lease&quot;]]]}]}],[0,{&quot;label&quot;:[0,&quot;Defined in&quot;],&quot;value&quot;:[0,&quot;RFC 2131, RFC 2132&quot;],&quot;backing&quot;:[0,{&quot;traces&quot;:[1,[[0,&quot;fact-defined&quot;]]]}]}]]]}],&quot;steps&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;discover&quot;],&quot;title&quot;:[0,&quot;DHCP Discover&quot;],&quot;sub&quot;:[0,&quot;The laptop asks: is anyone there?&quot;],&quot;narrative&quot;:[0,&quot;Your laptop just joined the Wi-Fi, but it has no address yet. It doesn’t know who to ask, so it shouts to everyone on the network at once: “Can anyone give me an address?” That shout is called a **Discover**. Every device hears it. The phone hears it too, but it isn’t the one that hands out addresses, so it ignores it.&quot;],&quot;deep&quot;:[1,[[0,{&quot;text&quot;:[0,&quot;The shout is a broadcast to 255.255.255.255, sent from 0.0.0.0 (“I have no address yet”) to UDP port 67, where DHCP servers listen.&quot;],&quot;cite&quot;:[1,[[0,{&quot;source&quot;:[0,&quot;rfc-2131&quot;],&quot;section&quot;:[0,&quot;4.1&quot;],&quot;url&quot;:[0,&quot;https://www.rfc-editor.org/rfc/rfc2131.html#section-4.1&quot;],&quot;label&quot;:[0,&quot;RFC 2131 §4.1&quot;],&quot;defining&quot;:[0,true]}],[0,{&quot;source&quot;:[0,&quot;rfc-2131&quot;],&quot;section&quot;:[0,&quot;4.4.1&quot;],&quot;url&quot;:[0,&quot;https://www.rfc-editor.org/rfc/rfc2131.html#section-4.4.1&quot;],&quot;label&quot;:[0,&quot;RFC 2131 §4.4.1&quot;],&quot;defining&quot;:[0,true]}],[0,{&quot;source&quot;:[0,&quot;rfc-1122&quot;],&quot;section&quot;:[0,&quot;3.2.1.3&quot;],&quot;url&quot;:[0,&quot;https://www.rfc-editor.org/rfc/rfc1122.html#page-30&quot;],&quot;label&quot;:[0,&quot;RFC 1122, 3.2.1.3&quot;]}]]]}]]],&quot;facts&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;From&quot;],&quot;value&quot;:[0,&quot;0.0.0.0, UDP port 68&quot;],&quot;backing&quot;:[0,{&quot;traces&quot;:[1,[[0,&quot;fact-first&quot;],[0,&quot;fact-ports&quot;]]]}]}],[0,{&quot;label&quot;:[0,&quot;To&quot;],&quot;value&quot;:[0,&quot;255.255.255.255, UDP port 67&quot;],&quot;backing&quot;:[0,{&quot;traces&quot;:[1,[[0,&quot;fact-first&quot;],[0,&quot;fact-ports&quot; ><\/caption><thead><tr><th scope=\"col\">IP address<\/th><th scope=\"col\">MAC address<\/th><th scope=\"col\">Device<\/th><th scope=\"col\">Expires<\/th><\/tr><\/thead><tbody><tr><td data-label=\"IP address\">192.168.1.100<\/td><td data-label=\"MAC address\">00:00:5E:00:53:10<\/td><td class=\"tpanel__prose\" data-label=\"Device\">Laptop<\/td><td class=\"tpanel__prose\" data-label=\"Expires\">in 24 h (renewed)<\/td><\/tr><\/tbody><\/table><\/div><\/section><section class=\"console__panel console__explain\" aria-label=\"Explanation\" tabindex=\"0\"><p class=\"explain__kicker\">Practice<\/p><h2 class=\"explain__title\">Three questions<\/h2><p class=\"explain__sub\">Just for you. Nothing is scored. A question you miss is kept on the <a href=\"/practice#to-try-again\" title=\"Goes to /practice#to-try-again\">Practice page<\/a>.<\/p><ol class=\"practice\"><li class=\"practice__question\"><p class=\"practice__prompt\" id=\"_r1r_0_-0\"><span class=\"practice__number\" aria-hidden=\"true\">1<\/span><span>The laptop has just joined the Wi-Fi. Why does it shout its first message to everyone?<\/span><\/p><div class=\"practice__options\" role=\"group\" aria-labelledby=\"_r1r_0_-0\"><button type=\"button\" class=\"practice__option\" aria-pressed=\"false\"><span class=\"practice__letter\">A<\/span><span>It doesn’t know yet who hands out addresses.<\/span><\/button><button type=\"button\" class=\"practice__option\" aria-pressed=\"false\"><span class=\"practice__letter\">B<\/span><span>Shouting is faster than asking one device.<\/span><\/button><button type=\"button\" class=\"practice__option\" aria-pressed=\"false\"><span class=\"practice__letter\">C<\/span><span>So the phone can answer if the router is busy.<\/span><\/button><\/div><p class=\"practice__feedback\"><span class=\"practice__say\" aria-live=\"polite\"><\/span><\/p><\/li><li class=\"practice__question\"><p class=\"practice__prompt\" id=\"_r1r_0_-1\"><span class=\"practice__number\" aria-hidden=\"true\">2<\/span><span>How does the router make sure two devices never get the same address?<\/span><\/p><div class=\"practice__options\" role=\"group\" aria-labelledby=\"_r1r_0_-1\"><button type=\"button\" class=\"practice__option\" aria-pressed=\"false\"><span class=\"practice__letter\">A<\/span><span>It gives every device the same address, then changes it later.<\/span><\/button><button type=\"button\" class=\"practice__option\" aria-pressed=\"false\"><span class=\"practice__letter\">B<\/span><span>It writes each loan in its lease table, and only offers addresses that are free.<\/span><\/button><button type=\"button\" class=\"practice__option\" aria-pressed=\"false\"><span class=\"practice__letter\">C<\/span><span>It asks the phone which addresses are taken.<\/span><\/button><\/div><p class=\"practice__feedback\"><span class=\"practice__say\" aria-live=\"polite\"><\/span><\/p><\/li><li class=\"practice__question\"><p class=\"practice__prompt\" id=\"_r1r_0_-2\"><span class=\"practice__number\" aria-hidden=\"true\">3<\/span><span>The laptop borrowed its address for 24 hours. When does it first ask to keep it?<\/span><\/p><div class=\"practice__options\" role=\"group\" aria-labelledby=\"_r1r_0_-2\"><button type=\"button\" class=\"practice__option\" aria-pressed=\"false\"><span class=\"practice__letter\">A<\/span><span>After about 12 hours, halfway through.<\/span><\/button><button type=\"button\" class=\"practice__option\" aria-pressed=\"false\"><span class=\"practice__letter\">B<\/span><span>Only once the 24 hours have run out.<\/span><\/button><button type=\"button\" class=\"practice__option\" aria-pressed=\"false\"><span class=\"practice__letter\">C<\/span><span>Every time it sends a message.<\/span><\/button><\/div><p class=\"practice__feedback\"><span class=\"practice__say\" aria-live=\"polite\"><\/span><\/p><\/li><\/ol><div class=\"explain__end\"><p>That’s the whole lesson.<\/p><a class=\"upnext lift\" href=\"/networking/firewalls\"><span class=\"upnext__art\" aria-hidden=\"true\"><sv ero] .icon-btn:hover { background: var(--bg-soft); }\n@media (width <= 959px) {\n  .site-head .wrap { grid-template-columns: 1fr auto; }\n  .site-nav, .head-end .btn { display: none; }\n  .menu-btn { display: grid; }\n  .menu-panel { border-top: 1px solid var(--line); padding: 8px 16px 16px; }\n  .menu-panel:not([hidden]) { gap: 2px; display: grid; }\n  .menu-panel a { border-bottom: 1px solid var(--line); color: var(--ink-strong); font: 600 17px/1.2 var(--sans); padding: 12px 4px; text-decoration: none; }\n  .menu-panel .btn { color: var(--accent-ink); border-bottom: 0px; margin-top: 12px; }\n}\n.site-foot { border-top: 1px solid var(--line); background: var(--bg-soft); margin-top: 128px; }\n.foot-grid { grid-template-columns: minmax(0px, 2fr) repeat(2, minmax(0px, 1fr)); gap: 32px; padding: 56px 0px 40px; display: grid; }\n.foot-grid p { max-width: 24em; color: var(--muted); margin: 14px 0px 0px; font-size: 15.5px; }\n.foot-grid h3 { font: 600 17px/1.2 var(--display); color: var(--ink-strong); margin: 4px 0px 14px; }\n.foot-grid ul { gap: 10px; margin: 0px; padding: 0px; font-size: 15.5px; list-style: none; display: grid; }\n.foot-grid ul a { color: var(--muted); text-decoration: none; }\n.foot-grid ul a:hover { color: var(--ink-strong); }\n.foot-base { border-top: 1px solid var(--line); color: var(--muted); padding: 20px 0px 28px; font-size: 14px; }\n@media (width <= 720px) {\n  .site-foot { margin-top: 96px; }\n  .foot-grid { grid-template-columns: 1fr 1fr; }\n  .foot-grid > div:first-child { grid-column: 1 / -1; }\n}\nhtml { scroll-behavior: smooth; }\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n}\n.a-open { padding-top: clamp(24px, 4vw, 48px); padding-bottom: clamp(28px, 4vw, 48px); }\n.a-crumbs ol { color: var(--muted); gap: 8px; margin: 0px 0px 18px; padding: 0px; font-size: 15px; list-style: none; display: flex; }\n.a-crumbs li + li::before { content: \"/\"; margin-right: 8px; }\n.a-crumbs a { color: inherit; text-decoration: none; }\n.a-crumbs a:hover { text-decoration: underline; }\n.a-crumbs [aria-current] { color: var(--ink-strong); }\n.a-open h1 { letter-spacing: -0.008em; text-wrap: balance; max-width: 13em; margin: 0px; font-size: clamp(44px, 7.4vw, 104px); line-height: 0.92; }\n.a-open__row { border-top: 2px solid var(--ink-strong); grid-template-columns: minmax(0px, 1fr) auto; align-items: end; gap: 24px clamp(24px, 5vw, 80px); margin-top: clamp(20px, 3vw, 36px); padding-top: 20px; display: grid; }\n.a-lede { max-width: 34em; color: var(--ink-strong); margin: 0px; font-size: 19px; line-height: 1.5; }\n.stats { gap: clamp(20px, 3vw, 44px); margin: 0px; display: flex; }\n.stats div { flex-direction: column-reverse; gap: 2px; display: flex; }\n.stats dd { color: var(--ink-strong); font: 700 clamp(40px, 4.6vw, 64px) / .9 var(--display); margin: 0px; }\n.stats dt { color: var(--muted); font: 600 15px/1.2 var(--display); letter-spacing: 0.02em; white-space: nowrap; }\n.a-body { grid-template-columns: 200px minmax(0px, 46rem); align-items: start; gap: clamp(28px, 6vw, 96px); padding-top: clamp(28px, 4vw, 48px); display: grid; }\n.a-toc { position: sticky; top: 96px; }\n.a-toc ol { gap: 2px; margin: 0px; padding: 0px; list-style: none; display: grid; }\n.a-toc a { border-left: 3px solid var(--line); color: var(--ink); font: 600 16px/1.25 var(--display); padding: 8px 10px; text-decoration: none; display: block; }\n.a-toc a:hover { color: var(--ink-strong); }\n.a-toc a[aria-current] { border-left-color: var(--here); background: var(--here-soft); color: var(--ink-strong); }\n.a-sec { padding-bottom: clamp(36px, 5vw, 64px); scroll-margin-top: 92px; }\n.a-sec + .a-sec { border-top: 1px solid var(--line-strong); padding-top: clamp(28px, 4vw, 44px); }\n.a-sec:last-child { padding-bottom: 0px; }\n.a-sec h2 { margin: 0px 0px 14px; font-size: clamp(30px, 3.4vw, 42px); line-height: 1.05; }\n.a-sec p { margin: 0px 0px 14px; font-size: 18px; line-height: 1.55; }\n.a-sec p:last-child { margin-bottom: 0px; }\n.a-sec a { color: var(--link); }\n.a-steps { gap: 12px; margin: 20px 0px; padding: 0px; list-style: none; display: grid; }\n.a-steps li { grid-template-columns: 220px minmax(0px, 1fr); align-items: center; display: grid; overflow: hidden; }\n.a-steps .art { border-right: 1px solid var(--line-strong); background: var(--fig-bg); align-self: stretch; place-items: center; display: grid; }\n.a-steps .art svg { width: 100%; height: auto; display: block; }\n.a-steps .body { padding: 18px 22px; }\n.a-steps .n { color: var(--here); font: 600 15px/1.2 var(--display); letter-spacing: 0.02em; }\n.a-steps h3 { margin: 4px 0px 6px; font-size: 24px; }\n.a-steps p { font-size: 16.5px; }\n.a-note { border-left: 3px solid var(--ink-strong); background: var(--card); grid-template-columns: 22px minmax(0px, 1fr); gap: 12px; margin: 0px 0px 14px; padding: 14px 16px; display: grid; }\n.a-note b { color: var(--ink-strong); }\n.a-note .t { width: 22px; height: 22px; color: var(--ink-strong); margin-top: 3px; }\n.a-note p { font-size: 17px; }\n.a-facts { grid-template-columns: minmax(0px, 1fr) 260px; align-items: center; gap: 24px; margin-bottom: 18px; display: grid; }\n.a-facts__art svg { width: 100%; height: auto; display: block; }\n.a-src { padding: 18px 22px; }\n.a-src h3 { color: var(--muted); font: 600 15px/1.2 var(--display); letter-spacing: 0.02em; margin: 0px 0px 10px; }\n.a-src ul { margin: 0px; padding: 0px; list-style: none; display: grid; }\n.a-src li { border-top: 1px solid var(--line); grid-template-columns: 96px minmax(0px, 1fr); gap: 14px; padding: 10px 0px; font-size: 16.5px; display: grid; }\n.a-src li span { color: var(--ink-strong); font: 500 15px/1.6 var(--mono); }\n.a-credits { border-top: 1px solid var(--line-strong); grid-template-columns: 96px minmax(0px, 1fr); gap: 0px 14px; margin: 18px 0px 0px; display: grid; }\n.a-credits dt, .a-credits dd { border-bottom: 1px solid var(--line); margin: 0px; padding: 12px 0px; font-size: 16.5px; }\n.a-credits dt { color: var(--muted); font: 600 15px/1.7 var(--display); letter-spacing: 0.02em; }\n.a-saved { border-collapse: collapse; width: 100%; margin: 18px 0px; font-size: 16.5px; }\n.a-saved caption { color: var(--muted); font: 600 15px/1.2 var(--display); letter-spacing: 0.02em; text-align: left; padding-bottom: 8px; }\n.a-saved th, .a-saved td { border-top: 1px solid var(--line); text-align: left; vertical-align: top; padding: 12px 12px 12px 0px; font-weight: 400; }\n.a-saved thead th { border-top: 1px solid var(--line-strong); color: var(--muted); font: 600 14px/1.2 var(--display); letter-spacing: 0.02em; }\n.a-saved tbody th { color: var(--ink-strong); }\n.a-saved .where { white-space: nowrap; align-items: center; gap: 8px; display: inline-flex; }\n.a-saved .dot { background: var(--ink-strong); border-radius: 2px; width: 9px; height: 9px; }\n.a-saved .dot.off { box-shadow: inset 0 0 0 1.5px var(--muted); background: 0px 0px; }\n.a-reset { margin-top: 16px; }\n.a-reset .q { color: var(--ink-strong); margin: 0px 0px 10px; font-weight: 600; }\n.a-reset [role=\"group\"] { flex-wrap: wrap; align-items: center; gap: 10px; display: flex; }\n.a-reset [role=\"status\"] { color: var(--allowed-text); margin: 10px 0px 0px; font-size: 16px; }\n@media (width <= 860px) {\n  .a-open__row { grid-template-columns: minmax(0px, 1fr); align-items: start; }\n  .a-body { grid-template-columns: minmax(0px, 1fr); }\n  .a-toc { position: static; }\n  .a-toc .toc-h { display: none; }\n  .a-toc ol { gap: 6px; padding-bottom: 6px; display: flex; overflow-x: auto; }\n  .a-toc a { border: 1px solid var(--line-strong); white-space: nowrap; border-radius: 4px; }\n  .a-toc a[aria-current] { border-color: var(--here); }\n  .a-steps li { grid-template-columns: 110px minmax(0px, 1fr); }\n  .a-facts { grid-template-columns: minmax(0px, 1fr); }\n  .a-facts__art { max-width: 300px; }\n}\nastro-island, astro-slot, astro-static-slot { display: contents; }","body":"<svg class=\"lm-defs\" width=\"0\" height=\"0\" aria-hidden=\"true\" focusable=\"false\"><defs>\n  <linearGradient id=\"lm-top\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" class=\"la\"><\/stop><stop offset=\"1\" class=\"lb\"><\/stop><\/linearGradient>\n  <linearGradient id=\"lm-s0\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" class=\"la d3\"><\/stop><stop offset=\"1\" class=\"lb d3\"><\/stop><\/linearGradient>\n  <linearGradient id=\"lm-s1\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" class=\"la d2\"><\/stop><stop offset=\"1\" class=\"lb d2\"><\/stop><\/linearGradient>\n  <linearGradient id=\"lm-s2\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" class=\"la d1\"><\/stop><stop offset=\"1\" class=\"lb d1\"><\/stop><\/linearGradient>\n  <linearGradient id=\"lm-s3\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" class=\"la\"><\/stop><stop offset=\"1\" class=\"lb d1\"><\/stop><\/linearGradient>\n  <radialGradient id=\"lm-pool-g\"><stop offset=\"0\" class=\"lp\" stop-opacity=\".36\"><\/stop><stop offset=\".55\" class=\"lp\" stop-opacity=\".1\"><\/stop><stop offset=\"1\" class=\"lp\" stop-opacity=\"0\"><\/stop><\/radialGradient>\n<\/defs><\/svg><a class=\"skip-link\" href=\"#main\">Skip to content<\/a><header class=\"site-head\"><div class=\"wrap\"><a class=\"brand\" href=\"/\" aria-label=\"TechConcepts home\"><svg class=\"logo\" viewBox=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M24 3.5 43.5 13.25 24 23 4.5 13.25Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\/path><path d=\"M24 25.65 29.5 28.4 24 31.15 18.5 28.4Z\" fill=\"var(--logo-accent, #b04617)\" stroke=\"var(--logo-accent, #b04617)\" stroke-width=\"1.2\" stroke-linejoin=\"round\"><\/path><path d=\"M5.5 29.6 24 38.85 42.5 29.6V35.4L24 44.65 5.5 35.4Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\/path><\/svg><b>TechConcepts<\/b><\/a><nav class=\"pillnav site-nav\" aria-label=\"Site\"><a href=\"/tracks\" data-key=\"tracks\">Tracks<\/a><a href=\"/practice\" data-key=\"practice\">Practice<\/a><a href=\"/#try\" data-key=\"how\">How a lesson works<\/a><a href=\"/#sources\" data-key=\"sources\">Sources<\/a><a href=\"/about\" data-key=\"about\" aria-current=\"page\">About<\/a><\/nav><div class=\"head-end\"><button type=\"button\" class=\"icon-btn theme-toggle\" id=\"theme-toggle\" aria-label=\"Switch to dark theme\"><svg class=\"i-moon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\/path><\/svg><svg class=\"i-sun\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"12\" cy=\"12\" r=\"4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><\/circle><path d=\"M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\/path><\/svg><\/button><a class=\"btn btn--primary btn--small\" href=\"/tracks\">Start learning<\/a><button type=\"button\" class=\"icon-btn menu-btn\" id=\"menu\" aria-expanded=\"false\" aria-controls=\"menu-panel\" aria-label=\"Menu\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M4 12h16M4 17h16\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" fill=\"none\"><\/path><\/svg><\/button><\/div><\/div><nav class=\"menu-panel\" id=\"menu-panel\" aria-label=\"Site menu\" hidden=\"\"><a href=\"/tracks\" data-key=\"tracks\">Tracks<\/a><a href=\"/practice\" data-key=\"practice\">Practice<\/a><a href=\"/#try\" data-key=\"how\">How a lesson works<\/a><a href=\"/#sources\" data-key=\"sources\">Sources<\/a><a href=\"/about\" data-key=\"about\" aria-current=\"page\">About<\/a><a class=\"btn btn--primary\" href=\"/tracks\">Start learning<\/a><\/nav><\/header><main id=\"main\"><section class=\"wrap a-open\" aria-labelledby=\"about-title\"><nav class=\"a-crumbs\" aria-label=\"Breadcrumb\"><ol><li><a href=\"/\">Home<\/a><\/li><li><span aria-current=\"page\">About<\/span><\/li><\/ol><\/nav><h1 id=\"about-title\">Watch it happen, then learn its name.<\/h1><div class=\"a-open__row\"><p class=\"a-lede\">TechConcepts is a free site of short, visual lessons on how technology works. You watch a real process play out one step at a time, then read what it was, in plain words.<\/p><dl class=\"stats\"><div><dt>tracks planned<\/dt><dd>7<\/dd><\/div><div><dt>lessons ready<\/dt><dd>18<\/dd><\/div><div><dt>accounts needed<\/dt><dd>0<\/dd><\/div><\/dl><\/div><\/section><div class=\"wrap a-body\"><nav class=\"a-toc\" aria-label=\"On this page\"><p class=\"toc-h\">On this page<\/p><ol><li><a href=\"#what\" aria-current=\"location\">What it is<\/a><\/li><li><a href=\"#lessons\">How a lesson works<\/a><\/li><li><a href=\"#facts\">Where the facts come from<\/a><\/li><li><a href=\"#credits\">Credits<\/a><\/li><li><a href=\"#privacy\">Your progress<\/a><\/li><\/ol><\/nav><div><section class=\"a-sec\" id=\"what\" aria-labelledby=\"what-h\"><h2 id=\"what-h\">What TechConcepts is<\/h2><p>TechConcepts teaches how technology works by showing it. Each lesson plays a real process, such as a laptop asking the network for an address, one step at a time, and explains each step in plain words.<\/p><p>The first track, How the Internet Works, is written for anyone starting out, including people studying for entry-level IT certifications. Five more tracks are on the way: CompTIA A+, Cryptography, AI Concepts, Privilege Escalation, and Threat &amp; Vulnerability Management.<\/p><p>You don’t need an account, and you can open any lesson in any order.<\/p><\/section><section class=\"a-sec\" id=\"lessons\" aria-labelledby=\"lessons-h\"><h2 id=\"lessons-h\">How a lesson works<\/h2><p>Every lesson has the same three parts, so you always know where you are.<\/p><ol class=\"a-steps\"><li class=\"card\"><di ivate use, so nothing in a lesson points at a real machine.<\/p><\/section><section class=\"a-sec\" id=\"facts\" aria-labelledby=\"facts-h\"><h2 id=\"facts-h\">Where the facts come from<\/h2><div class=\"a-facts\"><p>Each lesson lists the standards it draws on under Sources at the end of Learn. Every lesson has also been through an independent check of every claim against those sources.<\/p><div class=\"a-facts__art\" aria-hidden=\"true\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"iso-svg lm-svg lm-sources\" viewBox=\"36 30 528 386\" role=\"img\" aria-label=\"A report sheet on a board, one line of it lit and marked with a source number, a small loupe standing over the end of that line. Beside the sheet, three bound standards are stacked. In front, a stamp rests on its ink pad, and its tick is on the foot of the sheet.\"><path class=\"lm-pool\" d=\"M526.4 383.3L514.3 389.1L501.5 394.6L488.2 399.7L474.4 404.4L460.1 408.8L445.4 412.8L430.2 416.4L414.8 419.6L399 422.4L382.9 424.8L366.6 426.7L350.1 428.3L333.5 429.4L316.8 430L300 430.2L283.2 430L266.5 429.4L249.9 428.3L233.4 426.7L217.1 424.8L201 422.4L185.2 419.6L169.8 416.4L154.6 412.8L139.9 408.8L125.6 404.4L111.8 399.7L98.5 394.6L85.7 389.1L73.6 383.3L62 377.3L51.1 370.9L40.9 364.2L31.4 357.3L22.7 350.2L14.7 342.8L7.5 335.3L1.1 327.5L-4.5 319.6L-9.3 311.6L-13.2 303.4L-16.3 295.2L-18.5 286.9L-19.8 278.5L-20.2 270.1L-19.8 261.8L-18.5 253.4L-16.3 245.1L-13.2 236.8L-9.3 228.7L-4.5 220.7L1.1 212.8L7.5 205L14.7 197.4L22.7 190.1L31.4 182.9L40.9 176L51.1 169.4L62 163L73.6 156.9L85.7 151.2L98.5 145.7L111.8 140.6L125.6 135.9L139.9 131.5L154.6 127.5L169.8 123.9L185.2 120.7L201 117.9L217.1 115.5L233.4 113.5L249.9 112L266.5 110.9L283.2 110.2L300 110L316.8 110.2L333.5 110.9L350.1 112L366.6 113.5L382.9 115.5L399 117.9L414.8 120.7L430.2 123.9L445.4 127.5L460.1 131.5L474.4 135.9L488.2 140.6L501.5 145.7L514.3 151.2L526.4 156.9L538 163L548.9 169.4L559.1 176L568.6 182.9L577.3 190.1L585.3 197.4L592.5 205L598.9 212.8L604.5 220.7L60 <script id="lesson-data" type="application/json">{"slug":"dhcp","title":"DHCP","subtitle":"Getting an address automatically","part":"Getting between networks","number":9,"url":"/networking/dhcp","learn":"/networking/dhcp?step=6","practice":"/networking/dhcp?step=7","questions":[{"id":"why-shout","key":"dhcp/why-shout","prompt":"The laptop has just joined the Wi-Fi. Why does it shout its first message to everyone?","answer":0,"options":[{"text":"It doesn’t know yet who hands out addresses.","feedback":"Right. With no address and no idea which device is the router, shouting to everyone is the only way to reach it. That shout is the Discover.","marks":[{"n":1,"url":"https://www.rfc-editor.org/rfc/rfc2131.html#section-4.4.4","places":"RFC 2131 §4.4.4; RFC 2131 §3.1"},{"n":2,"url":"https://support.microsoft.com/en-us/windows/experience/connectivity-networking/essential-network-settings-and-tasks-in-windows#:~:text=IP%20address%20settings%20and%20DNS%20server%20address%20setting%20are%20set%20automatically","places":"Microsoft Windows network settings, Change TCP/IP Settings"},{"n":3,"url":"https://support.google.com/googlehome/answer/7571856#:~:text=customize%20your%20router%20LAN%20address","places":"Google Nest LAN IP, Set a custom LAN IP"},{"n":4,"url":"https://www.rfc-editor.org/rfc/rfc1122.html#page-30","places":"RFC 1122, 3.2.1.3"}]},{"text":"Shouting is faster than asking one device.","feedback":"Not quite. Speed isn’t the reason. The laptop shouts because it doesn’t know yet who hands out addresses.","marks":[{"n":1,"url":"https://www.rfc-editor.org/rfc/rfc2131.html#section-4.4.4","places":"RFC 2131 §4.4.4; RFC 2131 §3.1"}]},{"text":"So the phone can answer if the router is busy.","feedback":"Not quite. The phone doesn’t hand out addresses, so it ignores the shout. The laptop shouts because it doesn’t know yet who to ask.","marks":[{"n":1,"url":"https://www.rfc-editor.org/rfc/rfc2131.html#section-1","places":"RFC 2131 §1; RFC 2131 §4.4.4"},{"n":10,"url":"https://canonical.com/blog/basic-dhcp-concepts#:~:text=Every%20machine%20on%20the%20network%20will%20see%20the%20packet","places":"Canonical blog, The network version of DORA"}]}]},{"id":"no-repeats","key":"dhcp/no-repeats","prompt":"How does the router make sure two devices never get the same address?","answer":1,"options":[{"text":"It gives every device the same address, then changes it later.","feedback":"Not quite. Two devices with the same address couldn’t both work properly. The router keeps a list and only offers addresses that are free.","marks":[{"n":1,"url":"https://www.rfc-editor.org/rfc/rfc2131.html#section-3.1","places":"RFC 2131 §3.1; RFC 2131 §1.5"},{"n":2,"url":"https://support.microsoft.com/en-us/windows/experience/connectivity-networking/essential-network-settings-and-tasks-in-windows#:~:text=IP%20address%20settings%20and%20DNS%20server%20address%20setting%20are%20set%20automatically","places":"Microsoft Windows network settings, Change TCP/IP Settings"},{"n":3,"url":"https://support.google.com/googlehome/answer/7571856#:~:text=customize%20your%20router%20LAN%20address","places":"Google Nest LAN IP, Set a custom LAN IP"},{"n":11,"url":"https://www.rfc-editor.org/rfc/rfc5227.html#section-2.4","places":"RFC 5227 §2.4"}]},{"text":"It writes each loan in its lease table, and only offers addresses that are free.","feedback":"That’s it. The lease table is the router’s list of who has which address.","marks":[{"n":1,"url":"https://www.rfc-editor.org/rfc/rfc2131.html#section-3.1","places":"RFC 2131 §3.1; RFC 2131 §1.5"},{"n":2,"url":"https://support.microsoft.com/en-us/windows/experience/connectivity-networking/essential-network-settings-and-tasks-in-windows#:~:text=IP%20address%20settings%20and%20DNS%20server%20address%20setting%20are%20set%20automatically","places":"Microsoft Windows network settings, Change TCP/IP Settings"},{"n":3,"url":"https://support.google.com/googlehome/answer/7571856#:~:text=customize%20your%20router%20LAN%20address","places":"Google Nest LAN IP, Set a custom LAN IP"},{"n":6,"url":"https://www.cisco.com/c/en/us/support/docs/ip/dynamic-address-allocation-resolution/27470-100.html#:~:text=Meanwhile,%20the%20DHCP%20server%20stores%20the%20lease","places":"Cisco DHCP troubleshooting, DHCPACK"}]},{"text":"It asks the phone which addresses are taken.","feedback":"Not quite. The phone doesn’t keep track of addresses. The router does, in its lease table.","marks":[{"n":1,"url":"https://www.rfc-editor.org/rfc/rfc2131.html#section-1.5","places":"RFC 2131 §1.5; RFC 2131 §1"},{"n":2,"url":"https://support.microsoft.com/en-us/windows/experience/connectivity-networking/essential-network-settings-and-tasks-in-windows#:~:text=IP%20address%20settings%20and%20DNS%20server%20address%20setting%20are%20set%20automatically","places":"Microsoft Windows network settings, Change TCP/IP Settings"},{"n":3,"url":"https://support.google.com/googlehome/answer/7571856#:~:text=customize%20your%20router%20LAN%20address","places":"Google Nest LAN IP, Set a custom LAN IP"},{"n":6,"url":"https://www.cisco.com/c/en/us/support/docs/ip/dynamic-address-allocation-resolution/27470-100.html#:~:text=Meanwhile,%20the%20DHCP%20server%20stores%20the%20lease","places":"Cisco DHCP troubleshooting, DHCPACK"}]}]},{"id":"when-renew","key":"dhcp/when-renew","prompt":"The laptop borrowed its address for 24 hours. When does it first ask to keep it?","answer":0,"options":[{"text":"After about 12 hours, halfway through.","feedback":"Yes. Asking halfway leaves plenty of time if the router doesn’t answer. That’s a Renew.","marks":[{"n":1,"url":"https://www.rfc-editor.org/rfc/rfc2131.html#section-4.4.5","places":"RFC 2131 §4.4.5"},{"n":2,"url":"https://support.microsoft.com/en-us/windows/experience/connectivity-networking/essential-network-settings-and-tasks-in-windows#:~:text=IP%20address%20settings%20and%20DNS%20server%20address%20setting%20are%20set%20automatically","places":"Microsoft Windows network settings, Change TCP/IP Settings"},{"n":3,"url":"https://support.google.com/googlehome/answer/7571856#:~:text=customize%20your%20router%20LAN%20address","places":"Google Nest LAN IP, Set a custom LAN IP"},{"n":9,"url":"https://learn.microsoft.com/en-us/windows-server/troubleshoot/troubleshoot-dhcp-issue#:~:text=renew%20the%20IP%20address%20assignment%20after%2050%20percent","places":"Microsoft DHCP troubleshooting, More information"}]},{"text":"Only once the 24 hours have run out.","feedback":"Not quite. Waiting until the end could leave the laptop without an address for a while. It asks halfway through.","marks":[{"n":1,"url":"https://www.rfc-editor.org/rfc/rfc2131.html#section-4.4.5","places":"RFC 2131 §4.4.5"},{"n":9,"url":"https://learn.microsoft.com/en-us/windows-server/troubleshoot/troubleshoot-dhcp-issue#:~:text=renew%20the%20IP%20address%20assignment%20after%2050%20percent","places":"Microsoft DHCP troubleshooting, More information"}]},{"text":"Every time it sends a message.","feedback":"Not quite. That would be a lot of asking. It first asks halfway through the 24 hours.","marks":[{"n":1,"url":"https://www.rfc-editor.org/rfc/rfc2131.html#section-4.4.5","places":"RFC 2131 §4.4.5"},{"n":9,"url":"https://learn.microsoft.com/en-us/windows-server/troubleshoot/troubleshoot-dhcp-issue#:~:text=renew%20the%20IP%20address%20assignment%20after%2050%20percent","places":"Microsoft DHCP troubleshooting, More information"}]}]}]}</script>
<script id="new-css" type="text/plain">
/* =====================================================================================================
   NEW in D7. Everything else in a screen is the site's own stylesheet as built.
   ===================================================================================================== */

/* ---- the kept line: D6's, rule for rule (prototypes/d6-practice-page.md, section 6) ---- */
.pp-kept { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 0; }
.pp-kept[data-state='kept'], .pp-kept[data-state='off'] { min-height: 44px; margin-top: 6px; border-top: 1px dashed var(--line-strong); }
.pp-kept__say { display: inline-flex; align-items: center; gap: 9px; color: var(--ink-strong); font: 600 14px/1.3 var(--display); letter-spacing: 0.02em; }
.pp-kept[data-state='off'] .pp-kept__say { color: var(--muted); }
.pp-kept__mark { flex: none; width: 9px; height: 9px; border: 1.5px solid var(--ink-strong); border-radius: 1px; background: var(--ink-strong); }
.pp-kept[data-state='off'] .pp-kept__mark { border-color: var(--muted); background: none; }
.pp-kept[data-state='none'] .pp-kept__mark { display: none; }
.pp-textbtn { min-width: 44px; min-height: 44px; padding: 0 8px; margin-inline-end: -8px; border: 0; border-radius: 4px; background: none; color: var(--ink-strong); font: 600 14px/1 var(--display); letter-spacing: 0.02em; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 0.25em; white-space: nowrap; cursor: pointer; }
.pp-textbtn:hover { text-decoration-color: currentColor; }
.pp-textbtn[hidden] { display: none; }

/* ---- the lesson's Practice part: the link in the line under its heading ---- */
.explain__sub a { color: var(--ink-strong); font-weight: 600; }

/* ---- About's reset row: the question takes a row of its own, so the two buttons always sit together under it ---- */
.a-reset .q { flex-basis: 100%; }

/* ---- the prototype's stand-in for a page's own content: not part of the design ---- */
.proto-stub { margin: 40px 0; padding: 28px 24px; border: 1.5px dashed #111; border-radius: 3px; background: #fff7c2; color: #111; font: 500 13px/1.5 ui-monospace, Menlo, monospace; }
.proto-stub--tall { min-height: 52vh; }
</script>

<script>
(function () {
  'use strict';
  var SCREENS = JSON.parse(document.getElementById('screens').textContent);
  var LESSON = JSON.parse(document.getElementById('lesson-data').textContent);
  var FONTS = document.getElementById('fonts').textContent;
  var NEW_CSS = document.getElementById('new-css').textContent;
  var params = new URLSearchParams(location.search);
  var frame = document.getElementById('frame');
  var state = {
    screen: ['chrome', 'lesson', 'about'].indexOf(params.get('screen')) !== -1 ? params.get('screen') : 'chrome',
    theme: params.get('theme') === 'dark' ? 'dark' : 'light',
    page: params.get('page') || 'home',
    kept: params.get('kept') === '1' ? '1' : '0',
    blocked: params.get('blocked') === '1' ? '1' : '0',
  };
  if (params.get('bare') === '1') document.documentElement.classList.add('bare');

  // ================================================================ what runs inside every screen
  function shared(api) {
    var root = document.documentElement;
    // No link leaves the prototype. A changed link says where it goes in its title.
    document.addEventListener('click', function (e) { if (e.target.closest('a')) e.preventDefault(); });
    // The header, as SiteHeader.astro's script.
    var menuButton = document.getElementById('menu');
    var menuPanel = document.getElementById('menu-panel');
    if (menuButton && menuPanel) {
      var setMenu = function (open) { menuButton.setAttribute('aria-expanded', String(open)); menuPanel.hidden = !open; };
      menuButton.addEventListener('click', function () { setMenu(menuButton.getAttribute('aria-expanded') !== 'true'); });
      menuPanel.addEventListener('click', function (e) { if (e.target.closest('a')) setMenu(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && menuButton.getAttribute('aria-expanded') === 'true') { setMenu(false); menuButton.focus(); } });
      api.menu = setMenu;
    }
    document.querySelectorAll('.theme-toggle, .console__theme, [aria-label^="Switch to"]').forEach(function (button) {
      button.addEventListener('click', function () { window.parent.protoSet('theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); });
    });
    var head = document.querySelector('.site-head');
    if (head) window.addEventListener('scroll', function () { head.classList.toggle('solid', window.scrollY > 24); }, { passive: true });
  }

  // ================================================================ screen 1: the header and footer on each page
  function chromeScreen(api) {
    var PAGES = {
      home: { current: null, start: true, say: 'The rest of Home is as it is today. No link is current on Home, as today, though two of them lead to parts of it.' },
      tracks: { current: ['tracks', 'page'], start: false, say: 'The Tracks page. Nothing on it changes but the header and the footer. It has no “Start learning”, as today.' },
      track: { current: ['tracks', 'true'], start: false, say: 'A track page (How the Internet Works, Networking Concepts). “Tracks” is the current section, not the current page, as today. Nothing else changes.' },
      about: { current: ['about', 'page'], start: true, say: 'About. Its own changes are on the About screen.' },
      notfound: { current: null, start: true, say: 'The 404 page. No link is current. Nothing on it changes but the header and the footer.' },
      practice: { current: ['practice', 'page'], start: true, say: 'The Practice page is D6’s prototype (prototypes/d6-practice-page.html).' },
    };
    var head = document.querySelector('.site-head');
    var main = document.getElementById('main');
    var hero = main.firstElementChild;
    var starts = [].slice.call(document.querySelectorAll('.head-end .btn, .menu-panel .btn')).map(function (node) { return { node: node, parent: node.parentNode, next: node.nextSibling }; });
    api.set = function (name, value) {
      if (name !== 'page') return;
      var page = PAGES[value] || PAGES.home;
      if (page.over) head.setAttribute('data-over-hero', ''); else head.removeAttribute('data-over-hero');
      document.querySelectorAll('.site-nav a, .menu-panel a:not(.btn)').forEach(function (a) {
        if (page.current && a.getAttribute('data-key') === page.current[0]) a.setAttribute('aria-current', page.current[1]); else a.removeAttribute('aria-current');
      });
      starts.forEach(function (s) { if (page.start) s.parent.insertBefore(s.node, s.next); else if (s.node.parentNode) s.node.remove(); });
      main.textContent = '';
      if (value === 'home') main.appendChild(hero);
      var stub = document.createElement('div');
      stub.className = 'wrap';
      stub.innerHTML = '<div class="proto-stub' + (value === 'home' ? '' : ' proto-stub--tall') + '"></div>';
      stub.firstChild.textContent = page.say;
      main.appendChild(stub);
      window.scrollTo(0, 0);
    };
  }

  // ================================================================ screen 2: the lesson's Practice part
  function lessonScreen(api, lesson) {
    var byKey = {};
    lesson.questions.forEach(function (q) { byKey[q.key] = q; });
    // ---- the list (the same store as the Practice page; D6's spec, section 11). The prototype keeps it in memory.
    var list = [];
    var blocked = false;
    var picks = {};
    var touched = {};
    function has(key) { return list.indexOf(key) !== -1; }
    function add(key) { if (!has(key)) list = [key].concat(list); }
    function remove(key) { list = list.filter(function (k) { return k !== key; }); }

    var LETTERS = 'ABCDEFGH';
    var LEADS = ['Right.', 'That’s it.', 'Yes.', 'Not quite.'];
    function splitFeedback(feedback, right) {
      for (var i = 0; i < LEADS.length; i++) if (feedback.indexOf(LEADS[i]) === 0) return { lead: LEADS[i], rest: feedback.slice(LEADS[i].length).replace(/^\s+/, '') };
      return { lead: right ? null : 'Not quite.', rest: feedback };
    }
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (name) { if (name === 'text') node.textContent = attrs[name]; else if (attrs[name] !== null) node.setAttribute(name, attrs[name]); });
      (children || []).forEach(function (child) { if (child) node.appendChild(child); });
      return node;
    }
    var updates = [];
    function drawQuestion(q, number) {
      var key = q.key;
      var promptId = 'p7-' + number;
      var options = q.options.map(function (option, oi) {
        var button = el('button', { type: 'button', class: 'practice__option', 'aria-pressed': 'false' }, [el('span', { class: 'practice__letter', text: LETTERS[oi] }), el('span', { text: option.text })]);
        button.addEventListener('click', function () {
          picks[key] = oi;
          if (oi === q.answer) remove(key); else { add(key); touched[key] = true; }
          update();
        });
        return button;
      });
      var say = el('span', { class: 'practice__say', 'aria-live': 'polite' });
      var feedback = el('p', { class: 'practice__feedback' }, [say]);
      var keptSay = el('span', { 'aria-live': 'polite' });
      var keptBtn = el('button', { type: 'button', class: 'pp-textbtn', 'aria-describedby': promptId, hidden: '' });
      keptBtn.addEventListener('click', function () { if (has(key)) remove(key); else { add(key); touched[key] = true; } update(); });
      var kept = el('div', { class: 'pp-kept', 'data-state': 'none' }, [el('span', { class: 'pp-kept__say' }, [el('i', { class: 'pp-kept__mark', 'aria-hidden': 'true' }), keptSay]), keptBtn]);
      function update() {
        var choice = Object.prototype.hasOwnProperty.call(picks, key) ? picks[key] : undefined;
        var right = choice === q.answer;
        options.forEach(function (button, oi) {
          button.setAttribute('aria-pressed', String(choice === oi));
          if (choice === oi) button.setAttribute('data-result', right ? 'right' : 'wrong'); else button.removeAttribute('data-result');
        });
        var marks = feedback.querySelector('.explain__marks');
        if (marks) marks.remove();
        say.textContent = '';
        if (choice === undefined) feedback.removeAttribute('data-result');
        else {
          var chosen = q.options[choice];
          var parts = splitFeedback(chosen.feedback, right);
          if (parts.lead !== null) { say.appendChild(el('b', { text: parts.lead })); say.appendChild(document.createTextNode(' ')); }
          say.appendChild(document.createTextNode(parts.rest));
          feedback.setAttribute('data-result', right ? 'right' : 'wrong');
          if (chosen.marks.length > 0) feedback.appendChild(el('sup', { class: 'explain__marks' }, chosen.marks.map(function (m) {
            return el('a', { href: m.url, title: m.places, 'aria-label': 'Source ' + m.n + ': ' + m.places + ' (opens in a new tab)', text: String(m.n) });
          })));
        }
        var st = has(key) ? 'kept' : touched[key] ? 'off' : 'none';
        var words = st === 'kept' ? (blocked ? 'Kept to try again, for this visit.' : 'Kept to try again.') : st === 'off' ? 'No longer kept.' : '';
        kept.setAttribute('data-state', st);
        if (keptSay.textContent !== words) keptSay.textContent = words;
        keptBtn.hidden = st === 'none';
        keptBtn.textContent = st === 'kept' ? 'Remove' : 'Keep it';
      }
      updates.push(update);
      update();
      return el('li', { class: 'practice__question', 'data-key': key }, [
        el('p', { class: 'practice__prompt', id: promptId }, [el('span', { class: 'practice__number', 'aria-hidden': 'true', text: String(number) }), el('span', { text: q.prompt })]),
        el('div', { class: 'practice__options', role: 'group', 'aria-labelledby': promptId }, options),
        feedback,
        kept,
      ]);
    }
    var ol = document.querySelector('.console__explain ol.practice');
    function draw() {
      updates = [];
      ol.textContent = '';
      lesson.questions.forEach(function (q, i) { ol.appendChild(drawQuestion(q, i + 1)); });
    }
    draw();
    api.set = function (name, value) {
      if (name === 'kept') { list = value === '1' ? [lesson.questions[0].key] : []; picks = {}; touched = {}; list.forEach(function (k) { touched[k] = true; }); draw(); }
      if (name === 'blocked') { blocked = value === '1'; updates.forEach(function (u) { u(); }); }
    };
    api.pick = function (key, oi) { var li = ol.querySelector('[data-key="' + key + '"]'); if (li) li.querySelectorAll('.practice__option')[oi].click(); };
  }

  // ================================================================ screen 3: About
  function aboutScreen(api) {
    // The reset row, as src/components/ResetProgress.tsx draws it, with this unit's words.
    var row = document.querySelector('.a-reset');
    var status = row.querySelector('[role="status"]');
    var QUESTION = 'Reset all progress on this device? This also empties your To try again list.';
    var blocked = false;
    function button() {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn btn--small'; b.textContent = 'Reset progress';
      b.addEventListener('click', function () { status.textContent = ''; ask(); });
      return b;
    }
    function clear() { [].slice.call(row.children).forEach(function (n) { if (n !== status) n.remove(); }); }
    function rest(focus) { clear(); if (blocked) return; var b = button(); row.insertBefore(b, status); if (focus) b.focus(); }
    function ask() {
      clear();
      var group = document.createElement('div');
      group.setAttribute('role', 'group'); group.setAttribute('aria-label', QUESTION); group.tabIndex = -1;
      var q = document.createElement('p'); q.className = 'q'; q.setAttribute('aria-hidden', 'true'); q.textContent = QUESTION;
      var yes = document.createElement('button'); yes.type = 'button'; yes.className = 'btn btn--small btn--primary'; yes.textContent = 'Reset';
      var no = document.createElement('button'); no.type = 'button'; no.className = 'btn btn--small'; no.textContent = 'Cancel';
      yes.addEventListener('click', function () { status.textContent = 'Progress cleared and list emptied'; rest(true); });
      no.addEventListener('click', function () { rest(true); });
      group.appendChild(q); group.appendChild(yes); group.appendChild(no);
      row.insertBefore(group, status);
      group.focus();
    }
    rest(false);
    api.set = function (name, value) { if (name === 'blocked') { blocked = value === '1'; status.textContent = ''; rest(false); } };
    api.ask = ask;
    api.go = function (id) { var target = document.getElementById(id); if (target) target.scrollIntoView({ behavior: 'instant', block: 'start' }); };
  }

  // ================================================================ the shell: one frame, redrawn when the screen changes
  var SCRIPTS = { chrome: chromeScreen, lesson: lessonScreen, about: aboutScreen };
  function esc(text) { return text.replace(/<\/(script|style)/gi, '<\\/$1'); }
  function draw() {
    var screen = SCREENS[state.screen];
    var data = state.screen === 'lesson' ? JSON.stringify(LESSON) : 'null';
    frame.srcdoc = '<!doctype html><html lang="en" class="js" data-theme="' + state.theme + '"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1"><title>' + state.screen + '</title>' +
      '<style>' + FONTS + '</style><style>' + screen.css + '</style><style>' + NEW_CSS + '</style></head>' +
      '<body class="' + screen.bodyClass + '">' + screen.body +
      '<script>window.proto = {}; (' + esc(shared.toString()) + ')(window.proto); (' + esc(SCRIPTS[state.screen].toString()) + ')(window.proto, ' + esc(data) + '); window.parent.protoReady();<\/script></body></html>';
  }
  var onReady = [];
  window.protoReady = function () {
    var api = frame.contentWindow.proto;
    if (state.screen === 'chrome') api.set('page', state.page);
    if (state.screen === 'lesson') { api.set('kept', state.kept); api.set('blocked', state.blocked); }
    if (state.screen === 'about') api.set('blocked', state.blocked);
    onReady.splice(0).forEach(function (fn) { fn(api); });
  };
  window.protoSet = function (name, value) {
    state[name] = value;
    if (name === 'screen') draw();
    else if (name === 'theme') frame.contentDocument.documentElement.setAttribute('data-theme', value);
    else if (frame.contentWindow.proto && frame.contentWindow.proto.set) frame.contentWindow.proto.set(name, value);
    marks();
  };
  function marks() {
    document.querySelectorAll('.proto [data-set]').forEach(function (button) {
      button.setAttribute('aria-pressed', String(state[button.getAttribute('data-set')] === button.getAttribute('data-val')));
    });
    document.querySelectorAll('.proto [data-for]').forEach(function (row) { row.hidden = row.getAttribute('data-for').split(' ').indexOf(state.screen) === -1; });
  }
  document.querySelectorAll('.proto [data-set]').forEach(function (button) {
    button.addEventListener('click', function () { window.protoSet(button.getAttribute('data-set'), button.getAttribute('data-val')); });
  });
  document.querySelectorAll('.proto [data-go]').forEach(function (button) {
    button.addEventListener('click', function () { frame.contentWindow.proto.go(button.getAttribute('data-go')); });
  });

  // The address can set a state: ?screen=chrome|lesson|about  ?theme=dark  ?page=home|tracks|track|about|notfound|practice
  // ?kept=1  ?blocked=1  ?bare=1  ?menu=1 (the phone's menu open)  ?pick=<key>:<option>,...  ?reset=ask|done  ?go=lessons|privacy
  onReady.push(function (api) {
    if (params.get('menu') === '1' && api.menu) api.menu(true);
    (params.get('pick') || '').split(',').forEach(function (pair) { var at = pair.lastIndexOf(':'); if (at > 0 && api.pick) api.pick(pair.slice(0, at), Number(pair.slice(at + 1))); });
    if (params.get('reset') && api.ask) { api.ask(); if (params.get('reset') === 'done') frame.contentDocument.querySelector('.a-reset .btn--primary').click(); }
    if (params.get('go') && api.go) api.go(params.get('go'));
  });
  marks();
  draw();
})();
</script>
</body>
</html>
