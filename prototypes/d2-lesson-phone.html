    gap: 0 4px;
    height: 30px;
    min-height: 0;
    overflow: hidden;
  }
  :root.js .labels-row > * {
    flex: none;
  }
  :root.js .labels-title {
    margin-right: 4px;
    line-height: 30px;
  }
  :root.js .labels-chip {
    padding: 3px 5px;
    font-size: 12.5px;
  }
  :root.js .labels-chip.is-read {
    padding: 2px 4px;
  }
  /* The note shows whole or not at all: when the chips leave it no room it wraps to a second line, which is cut. */
  :root.js .labels-note {
    line-height: 30px;
  }
  :root.js .console[data-reading] .labels {
    display: none;
  }

  /* --- 1. The tabs: three, or four when the lesson has a table --------------------------------------- */
  :root.js .console__tabs {
    grid-template-columns: none;
    grid-auto-columns: minmax(0, 1fr);
    grid-auto-flow: column;
  }
  /* The table has changed and the reader has not looked yet: a small square in the row mark's colour. */
  :root.js .console__tabs .tab__mark {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-inline-start: 7px;
    background: var(--selected);
    vertical-align: 0.12em;
  }

  /* --- 1, variant A. The lesson's table fills the part under the tabs, like the other three ----------- */
  :root.js[data-place='tab'] .tpanel,
  :root.js[data-place='tab'] .rpanel,
  :root.js[data-place='tab'] .bits {
    position: fixed;
    inset: calc(var(--ph-top) + var(--ph-stage) + var(--ph-tabs)) 0 var(--ph-ctl);
    max-height: none;
    overflow: auto;
    padding: 14px 14px 20px;
    border-top: 0;
    background: var(--card);
  }
  :root.js[data-place='tab'] .console:not([data-tab='table']) :is(.tpanel, .rpanel, .bits) {
    display: none;
  }

  /* --- 1, variant B. The table sits in Explain, under a step's words and above Go deeper ------------- */
  :root.js[data-place='words'] .console__stage > :is(.tpanel, .rpanel, .bits) {
    display: none;
  }
  :root.js .explain__panel {
    margin: 2px -22px 18px;
    border-block: 1px solid var(--line-strong);
    background: var(--card-2);
  }
  :root.js .explain__panel > :is(.tpanel, .rpanel, .bits) {
    max-height: none;
    overflow: visible;
    padding: 12px 14px 14px;
    border-top: 0;
  }

  /* --- 1. A table at phone width --------------------------------------------------------------------
     Three columns or fewer: still a table, fitted to the width. Words wrap; nothing scrolls sideways. */
  :root.js .tpanel caption {
    margin-bottom: 8px;
    line-height: 1.5;
  }
  :root.js .tpanel th,
  :root.js .tpanel td {
    padding: 6px 8px;
  }
  :root.js .tpanel th {
    white-space: normal;
  }
  :root.js .tpanel td {
    overflow-wrap: break-word;
  }

  /* Four columns or more: each row is an entry, the column's name beside each value. The names share one
     84px column, so every value starts at the same place, in every entry. The headings are still read out. */
  :root.js .tpanel__table:has(thead th:nth-child(4)),
  :root.js .tpanel__table:has(thead th:nth-child(4)) tbody,
  :root.js .tpanel__table:has(thead th:nth-child(4)) tr {
    display: block;
  }
  :root.js .tpanel__table:has(thead th:nth-child(4)) caption {
    display: block;
  }
  :root.js .tpanel__table:has(thead th:nth-child(4)) thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }
  :root.js .tpanel__table:has(thead th:nth-child(4)) tbody {
    border-top: 1px solid var(--line);
  }
  :root.js .tpanel__table:has(thead th:nth-child(4)) tr {
    border-bottom: 1px solid var(--line);
  }
  :root.js .tpanel__table:has(thead th:nth-child(4)) td[data-label] {
    display: grid;
    grid-template-columns: 84px minmax(0, 1fr);
    align-items: baseline;
    padding: 2px 8px 2px 11px;
    border-bottom: 0;
  }
  :root.js .tpanel__table:has(thead th:nth-child(4)) td[data-label]:first-child {
    padding-top: 9px;
    color: var(--ink-strong);
  }
  :root.js .tpanel__table:has(thead th:nth-child(4)) td[data-label]:last-child {
    padding-bottom: 9px;
  }
  :root.js .tpanel__table:has(thead th:nth-child(4)) td[data-label]::before {
    content: attr(data-label);
    color: var(--muted);
    font: 600 12.5px/1.4 var(--display);
    letter-spacing: 0.02em;
  }
  /* On a marked row the names take the ink the values have: muted words are not checked against the tint. */
  :root.js .tpanel__table:has(thead th:nth-child(4)) tr[data-highlight] > td[data-label]::before {
    color: var(--ink);
  }
  /* The row's bar runs down the whole entry, not only its first line. */
  :root.js .tpanel__table:has(thead th:nth-child(4)) tr[data-highlight] > td {
    background-image: linear-gradient(var(--selected), var(--selected));
    background-repeat: no-repeat;
    background-size: 3px 100%;
  }
  :root.js .tpanel__table:has(thead th:nth-child(4)) td.tpanel__empty {
    display: block;
    padding: 14px 8px;
    text-align: start;
  }

  /* The rule list (Firewalls): a rule is two lines. Number, action, port and source across the first;
     what the rule is for, and what the check found, on the second. */
  :root.js .rpanel caption {
    display: block;
    margin-bottom: 8px;
    line-height: 1.5;
    white-space: normal;
  }
  :root.js .rpanel__table,
  :root.js .rpanel__table thead,
  :root.js .rpanel__table tbody {
    display: block;
  }
  :root.js .rpanel__table colgroup {
    display: none;
  }
  :root.js .rpanel__table tr {
    display: grid;
    grid-template-columns: 26px 72px 74px minmax(0, 1fr);
    align-items: baseline;
    border-bottom: 1px solid var(--line);
  }
  :root.js .rpanel th,
  :root.js .rpanel td {
    padding: 6px 6px 3px;
    border-bottom: 0;
  }
  :root.js .rpanel td:first-child,
  :root.js .rpanel th:first-child {
    padding-inline-start: 10px;
  }
  :root.js .rpanel thead th:nth-child(n + 5) {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }
  :root.js .rpanel td.rpanel__prose {
    grid-row: 2;
    grid-column: 2 / 4;
    padding-block: 0 7px;
    overflow: visible;
    white-space: normal;
  }
  :root.js .rpanel td:last-child:not(.rpanel__empty) {
    grid-row: 2;
    grid-column: 4;
    justify-self: end;
    padding-block: 0 7px;
    padding-inline-end: 10px;
  }
  :root.js .rpanel td.rpanel__empty {
    grid-column: 1 / -1;
    text-align: start;
  }
  :root.js .rpanel__conns {
    margin-top: 14px;
  }
  :root.js .rpanel__chip {
    flex-wrap: wrap;
    row-gap: 4px;
    white-space: normal;
  }

  /* --- 2. The log's rows ----------------------------------------------------------------------------
     Every entry has the same three columns: the number (40px), the column's name (84px), the value.
     So Source and Destination start at the same place on their two lines, and from entry to entry.
     The words (a prose column) take a line of their own, with no name. The short values (a column the
     lesson gives 100px or less: Time, Protocol, Size, Prefix) share the last line, name before value. */
  :root.js .log__table tr {
    position: relative;
    gap: 2px 14px;
    padding: 9px 14px 9px 54px;
  }
  :root.js .log__table td:first-child:not(.log__idle) {
    position: absolute;
    top: 9px;
    left: 14px;
  }
  :root.js .log__table tr:has(> .log__idle) {
    padding-inline-start: 14px;
  }
  :root.js .log__table td[data-label] {
    display: grid;
    flex: 0 0 100%;
    grid-template-columns: 84px minmax(0, 1fr);
    align-items: baseline;
    overflow-wrap: anywhere;
    white-space: normal;
  }
  :root.js .log__table td[data-label]::before {
    content: attr(data-label);
    font: 600 12.5px/1.4 var(--display);
  }
  :root.js .log__table td.log__prose {
    display: block;
  }
  :root.js .log__table td.log__prose::before {
    content: none;
  }
  :root.js .log__table td.log__short {
    display: block;
    flex: 0 0 auto;
    order: 1;
    color: var(--muted);
    white-space: nowrap;
  }
  :root.js .log__table td.log__short::before {
    content: attr(data-label) '\a0';
  }

  /* The row that has just played pulses as one entry, not cell by cell. */
  :root.js .log__table tr[data-fresh] {
    animation: log-pulse 900ms var(--ease-out);
  }
  :root.js .log__table tr[data-fresh] td {
    animation: none;
  }

  /* --- 4. The stamp, at the end of the Overview's first line ------------------------------------------ */
  :root.js .explain__lead {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 6px 12px;
    margin: 0 0 10px;
  }
  :root.js .explain__lead .explain__kicker {
    margin: 0;
  }
  /* 13.5px, as in the top bar. The padding makes the link 31px tall to the finger without moving the line. */
  :root.js .explain__lead .stamp {
    display: inline-flex;
    flex: none;
    margin-block: -7px;
    padding-block: 7px;
    font-size: 13.5px;
  }
}

<style id="proto">
/* The prototype's own chrome: the desk view (a phone frame with the switches beside it) and, on a phone, the small
   "D2" button that opens the same switches. None of it is part of the design. */
.explain__lead .stamp {

.pt-desk body {
  min-height: 100vh;
  margin: 0;
  background: var(--bg-soft);
  color: var(--ink);
  font: 400 15px/1.5 var(--sans);
}
.pt-shell {
  display: grid;
  grid-template-columns: minmax(220px, 290px) auto minmax(230px, 310px);
  gap: 36px;
  align-items: start;
  justify-content: center;
  padding: 16px 24px 16px;
}
.pt-side {
  position: sticky;
  top: 16px;
}
.pt-unit {
  display: inline-block;
  margin: 0;
  padding: 3px 8px;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  background: var(--card);
  color: var(--muted);
  font: 600 13.5px/1.2 var(--display);
  letter-spacing: 0.02em;
}
.pt-side h1 {
  margin: 12px 0 10px;
  color: var(--ink-strong);
  font: 700 31px/1.08 var(--display);
  text-wrap: balance;
}
.pt-side h2 {
  margin: 0 0 4px;
  color: var(--ink-strong);
  font: 700 21px/1.2 var(--display);
}
.pt-note {
  margin: 0 0 6px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}
.pt-side--jumps .pt-note {
  margin-top: 18px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.pt-field > span {
  display: block;
  margin: 18px 0 6px;
  color: var(--muted);
  font: 600 13.5px/1.2 var(--display);
  letter-spacing: 0.02em;
}
.pt-seg {
  display: inline-flex;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: var(--tile);
}
.pt-seg--stack {
  display: flex;
  flex-direction: column;
}
.pt-seg button {
  padding: 9px 12px 8px;
  border: 0;
  border-bottom: 3px solid transparent;
  background: none;
  color: var(--ink);
  font: 600 15.5px/1 var(--display);
  letter-spacing: 0.01em;
  text-align: start;
  cursor: pointer;
}
.pt-seg:not(.pt-seg--stack) button + button {
  border-left: 1px solid var(--line);
}
.pt-seg--stack button {
  border-bottom: 0;
  border-left: 3px solid transparent;
}
.pt-seg--stack button + button {
  border-top: 1px solid var(--line);
}
.pt-seg button[aria-pressed='true'] {
  border-color: var(--here);
  background: var(--card);
  color: var(--ink-strong);
}
.pt-seg--stack button + button[aria-pressed='true'] {
  border-top-color: var(--line);
}
.pt-seg button:focus-visible,
.pt-side--jumps button:focus-visible,
.pt-jumps button:focus-visible,
.pt-open:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -2px;
}
.pt-stage {
  display: grid;
  justify-items: center;
  gap: 8px;
}
.pt-frame {
  box-sizing: content-box;
  display: block;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--card);
}
.pt-size {
  margin: 0;
  color: var(--muted);
  font: 500 12.5px/1 var(--mono);
}
.pt-side--jumps section {
  margin-top: 16px;
}
.pt-side--jumps h3 {
  display: flex;
  gap: 8px;
  align-items: baseline;
  margin: 0 0 4px;
  color: var(--ink-strong);
  font: 600 16.5px/1.25 var(--display);
}
.pt-side--jumps h3 i,
.pt-jumps i {
  flex: none;
  min-width: 18px;
  padding: 2px 0;
  border: 1px solid var(--line-strong);
  border-radius: 2px;
  color: var(--muted);
  font: 700 11.5px/1 var(--mono);
  text-align: center;
}
.pt-side--jumps ul {
  margin: 0;
  padding: 0 0 0 26px;
  list-style: none;
}
.pt-side--jumps li button,
.pt-jumps button {
  padding: 4px 0;
  border: 0;
  background: none;
  color: var(--link);
  font: 400 14.5px/1.35 var(--sans);
  text-align: start;
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent);
  text-underline-offset: 3px;
  cursor: pointer;
}
@media (max-width: 1040px) {
  .pt-shell {
    grid-template-columns: minmax(220px, 290px) auto;
  }
  .pt-side--jumps {
    position: static;
    grid-column: 1 / -1;
  }
}

/* On a phone: a small dashed button over the page's bottom corner, and a sheet. */
.pt-open {
  position: fixed;
  right: 8px;
  bottom: calc(72px + env(safe-area-inset-bottom));
  z-index: 40;
  width: 38px;
  height: 30px;
  padding: 0;
  border: 1px dashed var(--line-strong);
  border-radius: 4px;
  background: color-mix(in srgb, var(--card) 88%, transparent);
  color: var(--muted);
  font: 600 13px/1 var(--display);
  cursor: pointer;
}
.pt-sheet {
  position: fixed;
  inset: auto 8px calc(108px + env(safe-area-inset-bottom));
  z-index: 40;
  max-height: 64dvh;
  overflow: auto;
  padding: 0 14px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--card);
  box-shadow: var(--shadow-lg);
}
.pt-jumps {
  display: grid;
}
.pt-jumps button {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 6px 0;
}

/* The page draws its figure in once, when it loads. Here every step swaps the markup, so it would draw in each time. */
#app .lm-svg {
  animation: none;
}

<script>
/* The prototype's controller. It stands in for the lesson's React app: it lays the captured markup of the real
   page into the real page's structure, and makes the changes D2 asks of the markup (each is marked "D2 markup").
   The design itself is the stylesheet #d2. */
(async function () {
  const root = document.documentElement;
  const LESSONS = [
    ['dhcp', 'DHCP'],
    ['osi-model', 'OSI Model'],
    ['firewalls', 'Firewalls'],
  ];
  const VARIANTS = [
    ['today', 'Today, before the fixes'],
    ['a', 'A: the table in its own tab'],
    ['b', 'B: the table under the words'],
  ];
  /* Where to look, for each of the four fixes: [label, lesson, slot, tab]. */
  const JUMPS = [
    ['1', 'A table that has just changed', 'dhcp', 4, 'explain'],
    ['1', 'The lease table', 'dhcp', 4, 'table'],
    ['1', 'An empty table', 'dhcp', 1, 'table'],
    ['1', 'The rule list, a visit checked', 'firewalls', 2, 'table'],
    ['1', 'The rule list and what it remembers', 'firewalls', 5, 'table'],
    ['2', 'A packet log', 'dhcp', 5, 'log'],
    ['2', 'The firewall’s log', 'firewalls', 6, 'log'],
    ['2', 'OSI Model’s log', 'osi-model', 10, 'log'],
    ['3', 'One view: no band, the message strip pinned', 'osi-model', 6, 'explain'],
    ['3', 'Reading: the strip gives way', 'osi-model', 11, 'explain'],
    ['4', 'The stamp, checked', 'osi-model', 0, 'explain'],
    ['4', 'The stamp, not checked yet', 'dhcp', 0, 'explain'],
  ];

  // ---------------------------------------------------------------- state, kept in the address's hash
  const state = { l: 'dhcp', s: 0, t: 'explain', v: 'a', th: null, view: 'network', f: 0, seen: '' };
  function readHash() {
    for (const part of location.hash.slice(1).split('&')) {
      const [k, val] = part.split('=');
      if (k === 's' || k === 'f') state[k] = Number(val) || 0;
      else if (k in state && val) state[k] = decodeURIComponent(val);
    }
  }
  function hashOf(over) {
    const s = { ...state, ...over };
    return `#l=${s.l}&s=${s.s}&t=${s.t}&v=${s.v}&th=${s.th}&f=${s.f}`;
  }
  readHash();
  if (state.th === null) state.th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  root.dataset.theme = state.th;

  const framed = state.f === 1;
  const desk = !framed && innerWidth > 760;
  let wasDesk = desk;
  addEventListener('resize', () => {
    if (!framed && innerWidth > 760 !== wasDesk) location.reload();
  });

  // ================================================================ the desk: a phone frame and the switches
  if (desk) {
    root.classList.add('pt-desk');
    const size = { w: 390, h: 844 };
    document.body.innerHTML = `
      <div class="pt-shell">
        <aside class="pt-side">
          <p class="pt-unit">Prototype D2</p>
          <h1>The lesson on a phone, the leftovers</h1>
          <p class="pt-note">The page in the frame is the lesson as it runs today, with four fixes laid over it. Tap it as you would a phone.</p>
          <div class="pt-field"><span>Lesson</span><div class="pt-seg" data-key="l">${LESSONS.map(([k, n]) => `<button type="button" data-val="${k}">${n}</button>`).join('')}</div></div>
          <div class="pt-field"><span>Version</span><div class="pt-seg pt-seg--stack" data-key="v">${VARIANTS.map(([k, n]) => `<button type="button" data-val="${k}">${n}</button>`).join('')}</div></div>
          <div class="pt-field"><span>Theme</span><div class="pt-seg" data-key="th"><button type="button" data-val="light">Light</button><button type="button" data-val="dark">Dark</button></div></div>
          <div class="pt-field"><span>Screen</span><div class="pt-seg" data-key="size"><button type="button" data-val="390x844">390 × 844</button><button type="button" data-val="375x812">375 × 812</button></div></div>
        </aside>
        <div class="pt-stage"><iframe class="pt-frame" title="The lesson at phone width"></iframe><p class="pt-size"></p></div>
        <aside class="pt-side pt-side--jumps">
          <h2>Where to look</h2>
          ${[
            ['1', 'A place for the lesson’s table'],
            ['2', 'Log rows that line up'],
            ['3', 'No empty band above the scene'],
            ['4', 'The stamp'],
          ]
            .map(
              ([n, title]) =>
                `<section><h3><i>${n}</i>${title}</h3><ul>${JUMPS.map((j, i) => (j[0] === n ? `<li><button type="button" data-jump="${i}">${j[1]}</button></li>` : '')).join('')}</ul></section>`,
            )
            .join('')}
          <p class="pt-note">Play moves on one step here. The real run, and the scene’s motion, are not part of this prototype.</p>
        </aside>
      </div>`;
    const frame = document.querySelector('.pt-frame');
    const base = location.href.split('#')[0];
    function push() {
      frame.style.width = size.w + 'px';
      frame.style.height = size.h + 'px';
      document.querySelector('.pt-size').textContent = `${size.w} × ${size.h}`;
      const target = base + hashOf({ f: 1 });
      if (frame.dataset.src !== base) {
        frame.dataset.src = base;
        frame.src = target;
      } else frame.contentWindow.location.replace(target);
      history.replaceState(null, '', hashOf({ f: 0 }));
      for (const seg of document.querySelectorAll('.pt-seg')) {
        const cur = seg.dataset.key === 'size' ? `${size.w}x${size.h}` : state[seg.dataset.key];
        for (const b of seg.children) b.setAttribute('aria-pressed', String(b.dataset.val === cur));
      }
    }
    document.addEventListener('click', (e) => {
      const seg = e.target.closest('.pt-seg button');
      if (seg) {
        const key = seg.parentElement.dataset.key;
        if (key === 'size') [size.w, size.h] = seg.dataset.val.split('x').map(Number);
        else {
          if (key === 'l' && state.l !== seg.dataset.val) Object.assign(state, { s: 0, t: 'explain' });
          state[key] = seg.dataset.val;
          if (state.v !== 'a' && state.t === 'table') state.t = 'explain';
        }
        root.dataset.theme = state.th;
        push();
      }
      const jump = e.target.closest('[data-jump]');
      if (jump) {
        const [, , l, s, t] = JUMPS[Number(jump.dataset.jump)];
        Object.assign(state, { l, s, t: t === 'table' && state.v !== 'a' ? 'explain' : t });
        push();
      }
    });
    // The frame reports where it is, so the switches follow what is tapped inside it.
    addEventListener('message', (e) => {
      if (!e.data || e.data.d2 !== true) return;
      Object.assign(state, e.data.state);
      root.dataset.theme = state.th;
      history.replaceState(null, '', hashOf({ f: 0 }));
      for (const seg of document.querySelectorAll('.pt-seg')) {
        if (seg.dataset.key === 'size') continue;
        for (const b of seg.children) b.setAttribute('aria-pressed', String(b.dataset.val === state[seg.dataset.key]));
      }
    });
    push();
    return;
  }

  // ================================================================ the phone: the lesson itself
  root.classList.add('js');
  const DATA = await loadData();
  const app = document.createElement('div');
  app.id = 'app';
  document.body.appendChild(app);
  const d2style = document.getElementById('d2');

  /** The tab the lesson's panel gets, by its kind; none for the message strip, which stays under the scene. */
  function panelTab(html) {
    if (html.includes('class="tpanel"')) return 'Table';
    if (html.includes('class="rpanel"')) return 'Rules';
    if (html.includes('class="bits"')) return 'Bits';
    return null;
  }
  /** The event that last changed the panel on this step, as a key; '' when this step has not changed it. */
  function changeKey(slot) {
    return /data-highlight=|data-state=|data-new=|data-known=/.test(slot.panel) ? `${state.l}:${state.s}` : '';
  }

  function render() {
    const lesson = DATA.lessons[state.l];
    state.s = Math.min(Math.max(state.s, 0), lesson.slots.length - 1);
    const slot = lesson.slots[state.s];
    const d2 = state.v !== 'today';
    const tabName = d2 ? panelTab(slot.panel) : null;
    if (state.t === 'table' && !(state.v === 'a' && tabName)) state.t = 'explain';
    root.dataset.theme = state.th;
    if (d2) root.dataset.place = state.v === 'a' ? 'tab' : 'words';
    else delete root.dataset.place;
    d2style.media = d2 ? 'all' : 'not all';

    const S = DATA.shell;
    app.innerHTML =
      `<div class="console" data-tab="${state.t}"${slot.reading ? ' data-reading=""' : ''}>` +
      slot.top +
      S.outline + slot.outline + '</nav>' +
      '<div class="console__tabs" role="group" aria-label="Show"><button type="button" data-t="explain">Explain</button><button type="button" data-t="steps">Steps</button><button type="button" data-t="log">Log</button>' +
      // D2 markup: a fourth tab, named for the kind of panel the lesson has (variant A).
      (state.v === 'a' && tabName ? `<button type="button" data-t="table">${tabName}</button>` : '') +
      '</div>' +
      S.main + S.stage + slot.head + S.scene + slot.scene + '</div>' + slot.panel + '</section>' +
      S.explain + slot.explain + '</section>' +
      S.log + S.logHead + slot.logHead + slot.controls + '</div>' + S.logScroll + slot.logScroll + '</div></div>' +
      '</main></div>';

    for (const a of app.querySelectorAll('a[href]')) a.setAttribute('href', '#');
    const speed = app.querySelector('.cbtn--speed');
    speed.textContent = '1×';
    speed.title = 'Speed 1×. Click for 1.5×';
    speed.setAttribute('aria-label', speed.title);

    // As the page does: the row that has just played is marked fresh.
    if (/^Step /.test(slot.where)) [...app.querySelectorAll('.log__table tbody tr')].pop()?.setAttribute('data-fresh', '');

    if (d2) {
      // D2 markup: each cell of the lesson's table carries its column's name, as the log's cells already do.
      for (const table of app.querySelectorAll('.tpanel__table')) {
        const names = [...table.querySelectorAll('thead th')].map((th) => th.textContent);
        for (const tr of table.querySelectorAll('tbody tr')) [...tr.children].forEach((td, i) => !td.classList.contains('tpanel__empty') && td.setAttribute('data-label', names[i]));
      }
      // D2 markup: a log cell whose column is 100px wide or less is a short value.
      const cols = [...app.querySelectorAll('.log__table col')].map((c) => parseInt(c.style.width, 10) || Infinity);
      for (const tr of app.querySelectorAll('.log__table tbody tr')) [...tr.children].forEach((td, i) => i > 0 && cols[i] <= 100 && td.classList.add('log__short'));
      // D2 markup: on the Overview, the stamp at the end of the first line (the same link as the top bar's).
      const kicker = app.querySelector('.explain__kicker');
      const stamp = app.querySelector('.console__top .stamp');
      if (state.s === 0 && kicker && stamp) {
        const lead = document.createElement('div');
        lead.className = 'explain__lead';
        kicker.replaceWith(lead);
        lead.append(kicker, stamp.cloneNode(true));
      }
      // D2 markup, variant B: the panel is drawn in Explain, after a step's words, on the steps of Watch only.
      if (state.v === 'b' && tabName && /^Step /.test(slot.where)) {
        const panel = app.querySelector('.console__stage > :is(.tpanel, .rpanel, .bits)');
        const words = [...app.querySelectorAll('.console__explain > .explain__narr')].pop();
        if (panel && words) {
          const box = document.createElement('div');
          box.className = 'explain__panel';
          box.append(panel);
          words.after(box);
        }
      }
    }
    applyView();
    applyTab();
    const scroll = app.querySelector('.log__scroll');
    scroll.scrollTop = scroll.scrollHeight;
    report();
  }

  function applyView() {
    const slot = DATA.lessons[state.l].slots[state.s];
    const scene = app.querySelector('.console__scene');
    const figure = scene.querySelector('.stage__figure');
    for (const el of [...scene.children]) if (el !== figure) el.remove();
    const seq = state.view === 'sequence' && slot.sequence;
    if (seq) scene.insertAdjacentHTML('beforeend', slot.sequence);
    if (figure) figure.hidden = Boolean(seq);
    const buttons = app.querySelectorAll('.stage__views button');
    buttons.forEach((b, i) => b.setAttribute('aria-pressed', String(i === (seq ? 1 : 0))));
  }

  function applyTab() {
    const slot = DATA.lessons[state.l].slots[state.s];
    const key = changeKey(slot);
    if (state.t === 'table') state.seen = key;
    app.querySelector('.console').dataset.tab = state.t;
    for (const b of app.querySelectorAll('.console__tabs button')) {
      b.setAttribute('aria-pressed', String(b.dataset.t === state.t));
      if (b.dataset.t !== 'table') continue;
      // D2 markup: the mark on the tab, until the reader opens it. While it shows, the button's aria-label is its
      // own label and ", changed"; without the mark the button has no aria-label. (Errata, 2026-11-11.)
      b.querySelector('.tab__mark')?.remove();
      b.removeAttribute('aria-label');
      if (key !== '' && key !== state.seen) {
        b.setAttribute('aria-label', `${b.textContent}, changed`);
        b.insertAdjacentHTML('beforeend', '<span class="tab__mark" aria-hidden="true"></span>');
      }
    }
    if (state.t === 'table') app.querySelector(':is(.tpanel, .rpanel) :is([data-highlight], [data-state="allow"], [data-state="deny"])')?.scrollIntoView({ block: 'nearest' });
  }

  function report() {
    history.replaceState(null, '', hashOf({}));
    if (framed) parent.postMessage({ d2: true, state: { l: state.l, s: state.s, t: state.t, v: state.v, th: state.th } }, '*');
  }

  function go(slot) {
    state.s = slot;
    render();
  }

  app.addEventListener('click', (e) => {
    const el = (sel) => e.target.closest(sel);
    if (el('a[href]')) e.preventDefault();
    const tab = el('.console__tabs button');
    if (tab) {
      state.t = tab.dataset.t;
      applyTab();
      return report();
    }
    const item = el('.outline__item');
    if (item) {
      state.t = 'explain';
      return go([...app.querySelectorAll('.outline__item')].indexOf(item));
    }
    const view = el('.stage__views button');
    if (view) {
      state.view = view.textContent === 'Sequence' ? 'sequence' : 'network';
      return applyView();
    }
    if (el('.theme-toggle')) {
      state.th = state.th === 'dark' ? 'light' : 'dark';
      root.dataset.theme = state.th;
      return report();
    }
    const ctl = el('.console__controls .cbtn');
    if (ctl) {
      const all = [...app.querySelectorAll('.console__controls .cbtn')];
      const i = all.indexOf(ctl);
      const last = DATA.lessons[state.l].slots.length - 1;
      if (i === 1 && state.s > 0) go(state.s - 1);
      if (i === 3 && state.s < last) go(state.s + 1);
      // Play: here, on to the next step; from the last step, Learn or Practice, back to the first.
      if (i === 2) go(state.s >= last - 2 ? 1 : state.s + 1);
    }
  });

  addEventListener('hashchange', () => {
    const before = hashOf({});
    readHash();
    if (hashOf({}) !== before) render();
  });

  // The prototype's own switches, when it is opened on a phone itself.
  if (!framed) {
    const sheet = document.createElement('div');
    sheet.className = 'pt-phone';
    sheet.innerHTML = `<button type="button" class="pt-open" aria-expanded="false" aria-label="Prototype switches">D2</button>
      <div class="pt-sheet" hidden>
        <div class="pt-field"><span>Lesson</span><div class="pt-seg" data-key="l">${LESSONS.map(([k, n]) => `<button type="button" data-val="${k}">${n}</button>`).join('')}</div></div>
        <div class="pt-field"><span>Version</span><div class="pt-seg pt-seg--stack" data-key="v">${VARIANTS.map(([k, n]) => `<button type="button" data-val="${k}">${n}</button>`).join('')}</div></div>
        <div class="pt-field"><span>Where to look</span><div class="pt-jumps">${JUMPS.map((j, i) => `<button type="button" data-jump="${i}"><i>${j[0]}</i>${j[1]}</button>`).join('')}</div></div>
      </div>`;
    document.body.appendChild(sheet);
    const open = sheet.querySelector('.pt-open');
    const panel = sheet.querySelector('.pt-sheet');
    const sync = () => {
      for (const seg of sheet.querySelectorAll('.pt-seg')) for (const b of seg.children) b.setAttribute('aria-pressed', String(b.dataset.val === state[seg.dataset.key]));
    };
    sheet.addEventListener('click', (e) => {
      if (e.target === open) {
        panel.hidden = !panel.hidden;
        open.setAttribute('aria-expanded', String(!panel.hidden));
        sync();
        return;
      }
      const seg = e.target.closest('.pt-seg button');
      const jump = e.target.closest('[data-jump]');
      if (seg) {
        const key = seg.parentElement.dataset.key;
        if (key === 'l' && state.l !== seg.dataset.val) Object.assign(state, { s: 0, t: 'explain' });
        state[key] = seg.dataset.val;
      }
      if (jump) {
        const [, , l, s, t] = JUMPS[Number(jump.dataset.jump)];
        Object.assign(state, { l, s, t });
        panel.hidden = true;
        open.setAttribute('aria-expanded', 'false');
      }
      if (seg || jump) {
        render();
        sync();
      }
    });
  }

  render();

  /** The captured page, unpacked: it is stored gzipped, and each scene as a list of shared pieces. */
  async function loadData() {
    const b64 = document.getElementById('pt-data').textContent.trim();
    const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const data = JSON.parse(text);
    for (const lesson of Object.values(data.lessons)) for (const slot of lesson.slots) slot.scene = slot.scene.map((i) => lesson.pieces[i]).join('');
    return data;
  }
})();

</script>
</body>
</html>
