# Runs on every pull request and on every push to main or revamp. Cloudflare builds and deploys main on its own
# (docs/deploy.md); this workflow deploys nothing. It only says whether the tests pass.
name: CI

on:
  pull_request:
  push:
    # revamp is the long-lived branch the redesign is built on (docs/direction.md).
    branches: [main, revamp]

# A newer push to the same branch makes the older run pointless, so it is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  # The unit tests, then the same build Cloudflare runs: type-check, build, page-weight budgets, fact-check gate.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # One pass of the end-to-end tests: the 1440 dark desktop project, which runs every behaviour check, and the phone.
  # The other desktop sizes, the light theme and reduced motion stay a local run (npm run e2e): all seven projects
  # together take about six times as long. Playwright builds and serves the site itself (playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert @visual --project=d1440-dark --project=phone
      # The traces of failed tests (playwright.config.ts keeps them on failure), for whoever reads the red run.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
